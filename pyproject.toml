[project]
name = "mitup_bot"
dynamic = ["version"]
description = "Telegram social bot to manage your meetings"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    { name = "Enrique Araque", email = "minixute@gmail.com" },
    { name = "Juanpe Araque", email = "erjuanpea@gmail.com" }
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Hatch",
    "Topic :: Communications :: Chat"
]
dependencies = [
    "python-telegram-bot~=20.0",
    "click~=8.0",
    "python-dateutil",
    "sqlalchemy~=2.0.25",
    "psycopg2~=2.9",
    "sqlmodel~=0.0.14",
    "alembic~=1.6",
    "rich~=13.0",
]

[project.urls]
Source = "https://gitlab.com/meetupbot/mitup-telegram-bot"
Documentation = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/blob/main/README.md"
Issues = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/issues"

[tool.hatch.version]
path = "mitup_bot/__about__.py"

# Global pytest setup, mainline to run from VSCode
# Cannot launch VSCode tests/debug with cov plugin
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = "tests"
asyncio_mode = "auto"
filterwarnings = [
    # Dateutil is using a deprecated version of utc timestamp we cannot do anything about.
    'ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:dateutil.tz.tz'
]

[tool.mypy]
exclude = "conftest.py"
packages = "tests,mitup_bot,bin"
check_untyped_defs = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    # Don't run coverage bon bin scripts. These are scripts that are not forced to be tested as they
    # have no impact in production and mainly helper scripts
    "bin",
    "__about__.py",
]
exclude_also = [
    # Exclude protocol classes since they have no logic
    "class .*\\bProtocol\\):"
]
# --------------------------
# Builds
# --------------------------
[tool.hatch.build.targets.wheel]
exclude = [
    ".gitlab-ci.yaml",
    ".gitlab",
    ".vscode",
    "bin",
    "tests"
]
packages = ["mitup_bot"]


[tool.ruff]
line-length = 120
indent-width = 4
exclude = [".hatch", ".git", ".pytest_cache", ".mypy_cache", ".ruff_cache", "dist"]
src = ["mitup_bot", "tests"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["mitup_bot", "tests"]
# Eensure alembic is not confused with our local alembic folder
known-third-party = ["alembic"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


# --------------------------
# Development/CI environment
# --------------------------
[tool.hatch.envs.dev]
description = """
Enviroment to be used for bot testing
"""
dependencies = [
    "pytest~=7.3",
    "pytest-asyncio~=0.21",
    "pytest-cov~=4.1",
    "pytest-xdist~=3.5",
    "mypy~=1.0",
    "pytest-asyncio",
    "freezegun",
    "ruff~=0.2",
    "boto3~=1.34",
    "boto3-stubs[essential,ecs]",
]

[tool.hatch.envs.dev.scripts]
test = "pytest -n 4 --cov=mitup_bot --cov-report term-missing:skip-covered tests"
test-cov = "pytest -n 4 --cov=mitup_bot --cov-report term-missing:skip-covered tests/ --cov-report xml:coverage.xml --junitxml=report.xml"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check {args:.}  --unsafe-fixes ."
type-check = "mypy"
validate = [
    "- format-check",
    "- lint",
    "- type-check",
    "- test",
]
setup-vscode = "python bin/setup_vscode.py"
migrations-upgrade = "alembic upgrade head"
migrations-downgrade = "alembic downgrade -1"
launch = "python -m mitup_bot.cli.run launch"
help = "python -m mitup_bot.cli.run launch --help"
deploy = "python -m mitup_bot.cli.run deploy {args:}"


# ----------------------
# Production environment
# ----------------------
[tool.hatch.envs.prod.scripts]
launch = "python -m mitup_bot.cli.run launch --env prod"
help = "python -m mitup_bot.cli.run launch --help"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
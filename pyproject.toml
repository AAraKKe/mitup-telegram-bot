# This is a virtual workspace root: it declares no [project] and builds no wheel. Every shippable
# unit is a workspace member under apps/, libs/ or tools/. The root only wires the workspace
# together and carries the shared tool configuration (ty/ruff/pytest/coverage).

# Global pytest setup, mainline to run from VSCode
# Cannot launch VSCode tests/debug with cov plugin
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = "tests"
# The virtual root installs no package, so the repo root is not on sys.path by default; add it so the
# `tests` support package (tests.helpers, …) imports the same way it did under the old root install.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # Dateutil is using a deprecated version of utc timestamp we cannot do anything about.
    'ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:dateutil.tz.tz',
    # Warning thrown by alembic on the test we break on purpose the revision graph
    'ignore:.*Revision rev3.*Migration 4:UserWarning',
    # Ignore warnings from PTB regarding ChatFullInfo since we do not use that information
    'ignore:.*is deprecated and will only be accessible via `ChatFullInfo`.*:DeprecationWarning:telegram.*',
    # AsyncMock coroutines GC'd across xdist workers trigger spurious "coroutine was never awaited" warnings
    'ignore:coroutine .* was never awaited:RuntimeWarning',
    # Accessing RetryAfter.retry_after warns until the PTB_TIMEDELTA opt-in; flood_control_backoff
    # already handles both the int and timedelta forms, so the type migration is a no-op here.
    'ignore:.*attribute `retry_after` will be of type `datetime.timedelta`.*:telegram.warnings.PTBDeprecationWarning',
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db_test: marks tests requiring a live Postgres container (deselected unless --db-tests is given)",
    "i18n: marks a language-dependent test (auto-applied to every test that uses the `lang` fixture); CI runs the 6-language matrix over `-m i18n` and the rest once via `-m 'not i18n'`",
]
env_files = [".env"]

[tool.ty.src]
# tools/mb is deliberately not included: it is a standalone package type-checked under its
# own config (tools/mb/pyproject.toml); `mb typecheck` runs both checks.
# Every member that ships mitup_bot code is checked here as part of the root project, where
# each runtime dependency (including PTB) is resolvable. The libs and the events/lambda members
# reference PTB types only under TYPE_CHECKING, so they cannot be checked in isolation.
include = [
    "apps/bot/mitup_bot",
    "apps/events/mitup_bot",
    "apps/lambda-migrations/mitup_bot",
    "apps/lambda-alarm/mitup_bot",
    "libs/core/mitup_bot",
    "libs/monitoring/mitup_bot",
    "libs/data/mitup_bot",
    "libs/telegram/mitup_bot",
    "libs/patreon/mitup_bot",
    "tools/rails-migration/mitup_bot",
    "tests",
]
exclude = [
    "**/.vscode",
    "**/__pycache__",
    "**/.egg-info",
    "**/.git",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.venv",
    "**/.docker_uv",
    "**/*.egg-info",
    "aws",
    "site",
    "test.py",
    "dist",
    "conftest.py",
    # The mb workspace member carries its own ty configuration (checked by `mb typecheck`)
    "tools/mb",
    # Ignore migrations since updates in type checker would force to update them
    "libs/data/mitup_bot/migrations/versions",
]

# StubBot deliberately mixes ExtBot with AsyncMock, so its inherited `__setattr__`/`__delattr__`
# genuinely conflict across the two bases — being both a real bot and a mock is the class's whole
# purpose, so the LSP violation is accepted here rather than suppressed inline (a `ty: ignore`
# would claim a false positive, and this is a true positive we opt out of for one test double).
[[tool.ty.overrides]]
include = ["tests/helpers/stub_bot.py"]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "__about__.py",
    # This does not impact the proper working of the bot
    "generate_stats.py",
]
exclude_also = [
    # Exclude protocol classes since they have no logic
    'class .*\bProtocol\):',
    # Exclude assert_nevers since we will never hit them and should be flagged by type checkers
    '^ +assert_never\(.*?\)$',
    # Case statements should be exhaustive
    '^ +case .*? as unreachable:$',
    # Ignore @overload functions
    '^ +@overload$',
    # Ignore type checking imports
    'if TYPE_CHECKING:',
]

[tool.ruff]
# Pin the target explicitly: the virtual root has no [project].requires-python for ruff to infer
# from, so without this ruff falls back to an older default and flags PEP 649 deferred annotations
# (unquoted forward references) as F821 and version-gated import sorting. Keep in step with the
# members' requires-python.
target-version = "py314"
line-length = 120
indent-width = 4
exclude = [
    ".docker_uv",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "sim.py",
]
# Point at the member package roots (each holds a mitup_bot/ or mb/ tree), NOT their parents:
# listing `libs`/`apps` directly would make ruff read the member directory names (telegram, core,
# data, …) as first-party module names and misclassify the real third-party imports.
src = [
    "apps/bot",
    "apps/events",
    "apps/lambda-migrations",
    "apps/lambda-alarm",
    "libs/core",
    "libs/monitoring",
    "libs/data",
    "libs/telegram",
    "libs/patreon",
    "tools/rails-migration",
    "tests",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["mitup_bot", "tests"]
# `tests` is a `src` root, so a `tests/<name>/` subtree would otherwise make `<name>` look like a
# first-party module. Pin the third-party packages that collide with a test subtree directory name
# (alembic; telegram, whose tests live in tests/telegram/) so their imports stay classified correctly.
known-third-party = ["alembic", "telegram"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
# Preserves types for libraries (like Pydantic/SLQModel) that
# rely on runtime type evaluation.
keep-runtime-typing = true

# --------------------------
# Development/CI environment
# --------------------------
[tool.uv.workspace]
members = [
    "tools/mb",
    "tools/rails-migration",
    "libs/core",
    "libs/monitoring",
    "libs/data",
    "libs/telegram",
    "libs/patreon",
    "apps/bot",
    "apps/events",
    "apps/lambda-migrations",
    "apps/lambda-alarm",
]

# The foundation libraries, applications and dev tools are all resolved from their in-repo sources.
[tool.uv.sources]
mb = { workspace = true }
mitup-core = { workspace = true }
mitup-monitoring = { workspace = true }
mitup-data = { workspace = true }
mitup-telegram = { workspace = true }
mitup-patreon = { workspace = true }
mitup-bot-app = { workspace = true }
mitup-events-app = { workspace = true }
mitup-lambda-migrations-app = { workspace = true }
mitup-lambda-alarm-app = { workspace = true }
mitup-rails-migration = { workspace = true }

# With no root [project], a plain `uv sync` installs the dependency-groups only. The `workspace`
# group lists every member so `uv sync` (which installs the default groups) still assembles the
# full development environment — the whole namespace importable, `mb` and the app console scripts
# on PATH — exactly as the old root package did.
[tool.uv]
default-groups = ["dev", "tools", "workspace"]
# Never resolve a release younger than 7 days — transitive dependencies included. Renovate's
# minimumReleaseAge (renovate.json) gates only the version it deliberately bumps; this gates
# every lock resolution. Keep both windows in sync.
exclude-newer = "7 days ago"

[dependency-groups]
tools = ["mb"]
workspace = [
    "mitup-core",
    "mitup-monitoring",
    "mitup-data",
    "mitup-telegram",
    "mitup-patreon",
    "mitup-bot-app",
    "mitup-events-app",
    "mitup-lambda-migrations-app",
    "mitup-lambda-alarm-app",
    "mitup-rails-migration",
]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-xdist~=3.8.0",
    "pytest-dotenv~=0.5.2",
    "pytest-json-report~=1.5.0",
    "ty==0.0.63",
    "freezegun~=1.5.5",
    "ruff==0.16.0",
    "boto3~=1.34",
    "debugpy",
    "zensical",
    "deepdiff",
    "boto3-stubs[essential]",
    "testcontainers[postgres]==4.15.0",
    "asgi-lifespan==2.1.0",
]

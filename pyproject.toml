[project]
name = "mitup_bot"
dynamic = ["version"]
description = "Telegram social bot to manage your meetings"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "Enrique Araque", email = "minixute@gmail.com" },
    { name = "Juanpe Araque", email = "erjuanpea@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.14",
    "Framework :: Hatch",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot[ext]==22.8",
    "click==8.4.2",
    "python-dateutil==2.9.0.post0",
    "sqlalchemy[asyncio]==2.0.51",
    "psycopg[binary]==3.3.4",
    "sqlmodel==0.0.39",
    "pydantic==2.13.4",
    "alembic==1.18.5",
    "rich==15.0.0",
    "structlog==26.1.0",
    "tzdata==2026.2",
    "googlemaps==4.10.0",
    "aws-embedded-metrics==3.5.0",
    "pyyaml==6.0.3",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
    "cryptography==49.0.0",
    "httpx==0.28.1",
]

[project.urls]
Source = "https://gitlab.com/meetupbot/mitup-telegram-bot"
Documentation = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/blob/main/README.md"
Issues = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/issues"

[project.scripts]
mitup = "mitup_bot.cli.run:main"

[tool.hatch.version]
path = "mitup_bot/__about__.py"

# Global pytest setup, mainline to run from VSCode
# Cannot launch VSCode tests/debug with cov plugin
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = "tests"
asyncio_mode = "auto"
filterwarnings = [
    # Dateutil is using a deprecated version of utc timestamp we cannot do anything about.
    'ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:dateutil.tz.tz',
    # Warning thrown by alembic on the test we break on purpose the revision graph
    'ignore:.*Revision rev3.*Migration 4:UserWarning',
    # Ignore warnings from PTB regarding ChatFullInfo since we do not use that information
    'ignore:.*is deprecated and will only be accessible via `ChatFullInfo`.*:DeprecationWarning:telegram.*',
    # AsyncMock coroutines GC'd across xdist workers trigger spurious "coroutine was never awaited" warnings
    'ignore:coroutine .* was never awaited:RuntimeWarning',
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db_test: marks tests requiring a live Postgres container (deselected unless --db-tests is given)",
]
env_files = [".env"]

[tool.ty.src]
include = ["mitup_bot", "tests", "bin"]
exclude = [
    "**/.vscode",
    "**/__pycache__",
    "**/.egg-info",
    "**/.git",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.hatch",
    "**/.docker_hatch",
    "**/*.egg-info",
    "aws",
    "site",
    "test.py",
    "dist",
    "conftest.py",
    # Ignore migrations since updates in type checker would force to update them
    "mitup_bot/migrations/versions",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    # Don't run coverage bon bin scripts. These are scripts that are not forced to be tested as they
    # have no impact in production and mainly helper scripts
    "bin",
    "__about__.py",
    # This does not impact the proper working of the bot
    "generate_stats.py",
    # No need to cover the local tooling CLI for coverage
    "setup_vscode.py",
    "cli/commands/dev.py",
]
exclude_also = [
    # Exclude protocol classes since they have no logic
    'class .*\bProtocol\):',
    # Exclude assert_nevers since we will never hit them and should be flagged by type checkers
    '^ +assert_never\(.*?\)$',
    # Case statements should be exhaustive
    '^ +case .*? as unreachable:$',
    # Ignore @overload functions
    '^ +@overload$',
    # Ignore type checking imports
    'if TYPE_CHECKING:',
]
# --------------------------
# Builds
# --------------------------
[tool.hatch.build.targets.wheel]
exclude = [".gitlab-ci.yaml", ".gitlab", ".vscode", "bin", "tests"]
packages = ["mitup_bot"]


[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    ".hatch",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "sim.py",
]
src = ["mitup_bot", "tests"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["mitup_bot", "tests"]
# Eensure alembic is not confused with our local alembic folder
known-third-party = ["alembic"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
# Preserves types for libraries (like Pydantic/SLQModel) that
# rely on runtime type evaluation.
keep-runtime-typing = true

# --------------------------
# Development/CI environment
# --------------------------
[tool.hatch.envs.dev]
description = """
Enviroment to be used for bot testing
"""
installer = "uv"
dependencies = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-xdist~=3.8.0",
    "pytest-dotenv~=0.5.2",
    "pytest-json-report~=1.5.0",
    "ty==0.0.56",
    "freezegun~=1.5.5",
    "ruff==0.15.0",
    "boto3~=1.34",
    "debugpy",
    "zensical",
    "deepdiff",
    "boto3-stubs[essential,ecs,cloudfront]",
    "testcontainers[postgres]==4.14.2",
    "asgi-lifespan==2.1.0",
]

[tool.hatch.envs.dev.scripts]
test = [
    "build-locales",
    "FORCE_COLOR=1 pytest -n 4 --cov=mitup_bot --cov-report term-missing:skip-covered {args:tests}",
]
test-hook = [
    "build-locales",
    "pytest -n 4 --no-cov --tb=short -q {args:tests}",
]
test-db = [
    "build-locales",
    "FORCE_COLOR=1 pytest --db-tests --dist no --junitxml=report.xml {args:tests/models/db_behavior/}",
]
test-cov = [
    "build-locales",
    "FORCE_COLOR=1 pytest -n 4 --cov=mitup_bot --cov-report term-missing:skip-covered --cov-report xml:coverage.xml --junitxml=report.xml --json-report --json-report-file=report.json {args:tests}",
]
format = "ruff format  ."
format-check = "ruff format --diff --check ."
lint = "ruff check {args:} --diff --unsafe-fixes ."
fix-lint = "ruff check --fix --unsafe-fixes ."
fix = ["format", "fix-lint"]
type-check = "ty check"
validate = ["- format-check", "- lint", "- type-check", "- test"]
check-commit = "python bin/check_commit_message.py {args:}"
migrations-upgrade = "alembic upgrade head"
migrations-downgrade = "alembic downgrade -1"
launch-events = "python -m mitup_bot.cli.run recurrent-events {args:}"
launch = "python -m mitup_bot.cli.run launch"
debug = "python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 --wait-for-client mitup_bot/cli/run.py launch"
help = "python -m mitup_bot.cli.run launch --help"
deploy = "python -m mitup_bot.cli.run deploy {args:}"
validate-migrations = "python -m mitup_bot.cli.run validate-migrations"
serve-docs = "zensical serve"
build-docs = "zensical build"
push-docs = "python -m mitup_bot.cli.run publish-docs {args:}"
update-source-language = "python -m mitup_bot.cli.run translations update"
validate-ids = "python -m mitup_bot.cli.run translations validate-ids"
validate-locales = "python -m mitup_bot.cli.run translations validate-locales"
build-locales = "python -m mitup_bot.cli.run translations build"
clean-locales = "python -m mitup_bot.cli.run translations clean-locales"
update-locales = ["update-source-language", "clean-locales", "build-locales", "validate-locales"]
set-local-bot = "python -m mitup_bot.cli.run dev {args:}"
populate-db = "python bin/populate_db.py {args:}"

# ----------------------
# Production environment
# ----------------------
[tool.hatch.envs.prod]
installer = "uv"
[tool.hatch.envs.prod.scripts]
launch = "mitup launch --env prod"
help = "mitup launch --help"
build-locales = "mitup translations build"
launch-events = "mitup recurrent-events {args:}"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

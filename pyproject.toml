[project]
name = "mitup_bot"
dynamic = ["version"]
description = "Telegram social bot to manage your meetings"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "Enrique Araque", email = "minixute@gmail.com" },
    { name = "Juanpe Araque", email = "erjuanpea@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot[ext]==22.8",
    "click==8.4.2",
    "python-dateutil==2.9.0.post0",
    "sqlalchemy[asyncio]==2.0.51",
    "psycopg[binary]==3.3.4",
    "sqlmodel==0.0.39",
    "pydantic==2.13.4",
    "alembic==1.18.5",
    "rich==15.0.0",
    "structlog==26.1.0",
    "tzdata==2026.3",
    "googlemaps==4.10.0",
    "pyyaml==6.0.3",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "cryptography==49.0.0",
    "httpx==0.28.1",
    "mitup-core",
    "mitup-monitoring",
]

[project.urls]
Source = "https://gitlab.com/meetupbot/mitup-telegram-bot"
Documentation = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/blob/main/README.md"
Issues = "https://gitlab.com/meetupbot/mitup-telegram-bot/-/issues"

[project.scripts]
mitup = "mitup_bot.cli.run:main"

[tool.hatch.version]
path = "mitup_bot/__about__.py"

# Global pytest setup, mainline to run from VSCode
# Cannot launch VSCode tests/debug with cov plugin
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = "tests"
asyncio_mode = "auto"
filterwarnings = [
    # Dateutil is using a deprecated version of utc timestamp we cannot do anything about.
    'ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:dateutil.tz.tz',
    # Warning thrown by alembic on the test we break on purpose the revision graph
    'ignore:.*Revision rev3.*Migration 4:UserWarning',
    # Ignore warnings from PTB regarding ChatFullInfo since we do not use that information
    'ignore:.*is deprecated and will only be accessible via `ChatFullInfo`.*:DeprecationWarning:telegram.*',
    # AsyncMock coroutines GC'd across xdist workers trigger spurious "coroutine was never awaited" warnings
    'ignore:coroutine .* was never awaited:RuntimeWarning',
    # Accessing RetryAfter.retry_after warns until the PTB_TIMEDELTA opt-in; flood_control_backoff
    # already handles both the int and timedelta forms, so the type migration is a no-op here.
    'ignore:.*attribute `retry_after` will be of type `datetime.timedelta`.*:telegram.warnings.PTBDeprecationWarning',
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db_test: marks tests requiring a live Postgres container (deselected unless --db-tests is given)",
]
env_files = [".env"]

[tool.ty.src]
# tools/mb is deliberately not included: it is a standalone package type-checked under its
# own config (tools/mb/pyproject.toml); `mb typecheck` runs both checks.
# The libs/* members share the mitup_bot namespace and are checked here as part of the root
# project, where every runtime dependency (including PTB) is resolvable — they reference PTB
# types only under TYPE_CHECKING, so they cannot be checked in isolation.
include = ["mitup_bot", "libs/core/mitup_bot", "libs/monitoring/mitup_bot", "tests"]
exclude = [
    "**/.vscode",
    "**/__pycache__",
    "**/.egg-info",
    "**/.git",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.venv",
    "**/.docker_uv",
    "**/*.egg-info",
    "aws",
    "site",
    "test.py",
    "dist",
    "conftest.py",
    # The mb workspace member carries its own ty configuration (checked by `mb typecheck`)
    "tools/mb",
    # Ignore migrations since updates in type checker would force to update them
    "mitup_bot/migrations/versions",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "__about__.py",
    # This does not impact the proper working of the bot
    "generate_stats.py",
]
exclude_also = [
    # Exclude protocol classes since they have no logic
    'class .*\bProtocol\):',
    # Exclude assert_nevers since we will never hit them and should be flagged by type checkers
    '^ +assert_never\(.*?\)$',
    # Case statements should be exhaustive
    '^ +case .*? as unreachable:$',
    # Ignore @overload functions
    '^ +@overload$',
    # Ignore type checking imports
    'if TYPE_CHECKING:',
]
# --------------------------
# Builds
# --------------------------
[tool.hatch.build.targets.wheel]
exclude = [".gitlab-ci.yaml", ".gitlab", ".vscode", "tools", "tests"]
packages = ["mitup_bot"]


[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    ".docker_uv",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "sim.py",
]
src = ["mitup_bot", "tests"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["mitup_bot", "tests"]
# Eensure alembic is not confused with our local alembic folder
known-third-party = ["alembic"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
# Preserves types for libraries (like Pydantic/SLQModel) that
# rely on runtime type evaluation.
keep-runtime-typing = true

# --------------------------
# Development/CI environment
# --------------------------
[tool.uv.workspace]
members = ["tools/mb", "libs/core", "libs/monitoring"]

# The dev CLI is wired through its own dependency group: `uv sync` installs
# the default groups, which brings `mb` onto every contributor's PATH.
# The foundation libraries are resolved from their in-repo sources.
[tool.uv.sources]
mb = { workspace = true }
mitup-core = { workspace = true }
mitup-monitoring = { workspace = true }

[tool.uv]
default-groups = ["dev", "tools"]

[dependency-groups]
tools = ["mb"]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-xdist~=3.8.0",
    "pytest-dotenv~=0.5.2",
    "pytest-json-report~=1.5.0",
    "ty==0.0.58",
    "freezegun~=1.5.5",
    "ruff==0.15.0",
    "boto3~=1.34",
    "debugpy",
    "zensical",
    "deepdiff",
    "boto3-stubs[essential]",
    "testcontainers[postgres]==4.14.2",
    "asgi-lifespan==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

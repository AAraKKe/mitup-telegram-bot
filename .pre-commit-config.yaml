# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: (^.gitlab-ci.yml$|^mkdocs.yml$|^.gitlab/)
      - id: check-added-large-files
        args: [--maxkb=700]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.0
    hooks:
      # Run the linter.
      - id: ruff
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.46.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]
  - repo: local
    hooks:
      - id: check-commit-message
        name: Check conventional commit message
        entry: uv run mb ci check-commit
        language: system
        stages: [commit-msg]
      - id: build-docs
        name: Build documentation
        entry: uv run mb docs build
        language: system
        pass_filenames: false
        files: ^(docs/|zensical\.toml$)
        stages: [pre-commit]
      - id: validate-locales
        name: Validate source language
        entry: uv run mb locales validate
        pass_filenames: false
        language: system
        stages:
          - pre-push

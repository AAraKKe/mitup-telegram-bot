services:
  run-tests:
    image: mitup-bot-dev
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    volumes:
      - .:/bot
      - ./.docker_hatch:/.docker_hatch
    command: hatch run dev:test

  migrations-upgrade:
    # Intended only for local migrations
    &migrations-service
    image: mitup-bot-dev
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/bot
      - ./.docker_hatch:/.docker_hatch
    environment:
      - MITUPBOT__DB__USERNAME=mitupbot
      - MITUPBOT__DB__PASSWORD=12345pass
      - MITUPBOT__DB__DATABASE=mitup
      - MITUPBOT__DB__URL=postgres
      - MITUPBOT__DB__PORT=5432
    command: hatch run dev:migrations-upgrade

  migrations-downgrade:
    # Intended only for local migrations
    <<: *migrations-service
    command: hatch run dev:migrations-downgrade

  populate-db:
    # Populate database with test data from YAML
    <<: *migrations-service
    command: hatch run dev:populate-db

  postgres:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: mitupbot
      POSTGRES_PASSWORD: 12345pass
      POSTGRES_DB: mitup
    ports:
      - 5444:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mitupbot -d mitup" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mitup: &launch-bot
    image: mitup-bot-dev
    depends_on:
      postgres:
        condition: service_healthy
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    environment:
      - MITUPBOT__METRICS__ENVIRONMENT=rich
      - MITUPBOT__METRICS__NAMESPACE=MitupDocker
    volumes:
      - .:/bot
      - ./.docker_hatch:/.docker_hatch
    command: bash -c "hatch run dev:update-locales && hatch run dev:launch"

  debug:
    <<: *launch-bot
    command: hatch run dev:debug
    ports:
      - 5678:5678

  events:
    <<: *launch-bot
    command: >
      bash -c "hatch run dev:update-locales &&
      hatch run dev:launch-events
      --notify-meeting-interval 5
      --user-cleanup-interval 10
      --generate-stats-interval 5
      --deactivate-meetings-interval 5
      --meetups-cleanup-interval 5
      --env dev"
    environment:
      - MITUPBOT__METRICS__ENVIRONMENT=rich
      - MITUPBOT__METRICS__NAMESPACE=MitupDocker/RecurrentEvents

services:
  run-tests:
    image: mitup-bot-dev
    pull_policy: build
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    volumes:
      - .:/bot
      - uv-venv:/.docker_uv/venv
      - uv-cache:/.docker_uv/cache
    command: uv run mb test

  migrations-upgrade:
    # Intended only for local migrations
    &migrations-service
    image: mitup-bot-dev
    pull_policy: build
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/bot
      - uv-venv:/.docker_uv/venv
      - uv-cache:/.docker_uv/cache
    environment:
      - MITUPBOT__DB__USERNAME=mitupbot
      - MITUPBOT__DB__PASSWORD=12345pass
      - MITUPBOT__DB__DATABASE=mitup
      - MITUPBOT__DB__URL=postgres
      - MITUPBOT__DB__PORT=5432
    # Alembic runs directly: `mb db migrate` itself wraps this service, so routing the service
    # back through mb would try to reach docker from inside the container.
    command: uv run alembic upgrade head

  migrations-downgrade:
    # Intended only for local migrations
    <<: *migrations-service
    command: uv run alembic downgrade -1

  postgres:
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_USER: mitupbot
      POSTGRES_PASSWORD: 12345pass
      POSTGRES_DB: mitup
    ports:
      - 5444:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mitupbot -d mitup" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway Postgres for the legacy Rails pg_dump, used only by the one-off rails migration.
  # No volume: every `docker compose up` starts from an empty database, ready for a fresh restore.
  heroku-postgres:
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_USER: mitupbot
      POSTGRES_PASSWORD: 12345pass
      POSTGRES_DB: rails
    ports:
      - 5445:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mitupbot -d rails" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mitup: &launch-bot
    image: mitup-bot-dev
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    build:
      dockerfile: ./dev/docker/Dockerfile.dev
    environment:
      - MITUPBOT__METRICS__ENVIRONMENT=rich
      - MITUPBOT__METRICS__NAMESPACE=MitupDocker
    volumes:
      - .:/bot
      - uv-venv:/.docker_uv/venv
      - uv-cache:/.docker_uv/cache
    command: bash -c "uv run mb locales sync && uv run mb run bot"

  debug:
    <<: *launch-bot
    command: uv run mb run bot --debug
    ports:
      - 5678:5678

  events:
    <<: *launch-bot
    command: >
      bash -c "uv run mb locales sync &&
      uv run mb run events
      --notify-meeting-interval 5
      --user-cleanup-interval 10
      --generate-stats-interval 5
      --deactivate-meetings-interval 5
      --meetups-cleanup-interval 5
      --send-broadcasts-interval 5
      --env dev"
    environment:
      - MITUPBOT__METRICS__ENVIRONMENT=rich
      - MITUPBOT__METRICS__NAMESPACE=MitupDocker/RecurrentEvents

volumes:
  # Per-checkout venv (compose prefixes the volume with the project name, so every
  # worktree keeps its own): a named volume lives on the Docker VM's native filesystem,
  # where installing a few hundred MB of packages takes seconds instead of crawling
  # through the macOS bind mount.
  uv-venv:
  # Shared across every checkout and worktree, so a fresh worktree resolves its venv
  # from already-downloaded packages and only fetches what its lock actually changed.
  # External because a compose-created volume belongs to one compose project and every
  # other checkout warns about it; `mb` creates the volume on demand before compose runs.
  uv-cache:
    name: mitup-bot-uv-cache
    external: true

# Custom image created for CI/CD purposes from Dockerfile.ci
image: registry.gitlab.com/meetupbot/mitup-telegram-bot/ci-python

# Templates for security and and code analysis
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Dependency-Scanning.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

# Global variables for all jobs
variables:
  # Exclude paths for SAST analysis
  SAST_EXCLUDED_PATHS: "tests, .hatch"

# Only run in MergeRequests, tags and default branch
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "release"

# Utilize web identity federation to allow AWS to perform STS calls on our behalf
.aws-prep: &aws-prep
  - |
      mkdir -p ~/.aws
      mkdir -p /tmp
      echo "${OIDC_TOKEN}" > /tmp/web_identity_token
      echo -e "[profile default]\nrole_arn=${SERVICE_CI_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config

.tokens: &tokens
  id_tokens:
      OIDC_TOKEN:
          aud: mitup-gitlab-ci-service

# Default cache for Hatch environments
cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
  - .hatch

# This is a GitLab provided job, no need to configure it
sast:
  stage: analysis

stages:
- analysis
- build-ci
- test
- prepare-deployment
- push-ecr
- deploy
- validate

cache-hatch:
  stage: build-ci
  script:
  - python --version
  - pip --version
  - hatch --version
  - hatch config set dirs.env.virtual .hatch
  - hatch config set dirs.cache .hatch
  # Trigger dev environment to cache it
  - hatch run dev:echo

pytest:
  stage: test
  script: hatch run dev:test-cov
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  needs: [cache-hatch]
  artifacts:
    when: always  # Important to get reports when test fail
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

format-check:
  stage: test
  script: hatch run dev:format-check
  needs: [cache-hatch]

flake8-lint:
  stage: test
  script: hatch run dev:lint
  needs: [cache-hatch]

mypy-typecheck:
  stage: test
  script: hatch run dev:type-check
  needs: [cache-hatch]


# --------------------
# Docker build and push images
# ---------------------
.kaniko-build-push: &kaniko
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}"
      --destination "${PUSH_DESTINATION}"

build-docker-ci:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python"
  <<: *kaniko
  rules:
    - if: $CI_COMMIT_TAG
    # When requested adding [build-ci] to the commit message
    - if: $CI_COMMIT_MESSAGE =~ /\[build-ci\]/
    # If no rule matched yet, allow building manually anytime that is needed
    - when: manual
      allow_failure: true

.aws-config: &aws-env-config
  # This prepares the environment needed for deployment, the intention is
  # to reduce the complexity of jobs interacting with AWS accounts. This job
  # builds a dotenv file that contains all configuration needed later.
  image:
    name: public.ecr.aws/aws-cli/aws-cli
    entrypoint: [""] # Avoid loading the entry point that forces an AWS command
  stage: prepare-deployment
  <<: *tokens
  before_script:
    *aws-prep
  script:
    - yum install jq -y # Install jq not avilable in the aws-cli docker image
    - aws ecr describe-repositories --region eu-west-1 > describe_response.json
    - ECR_MITUP_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "mitup") | .repositoryUri' describe_response.json)
    - ECR_MIGRATIONS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrations-lambda") | .repositoryUri' describe_response.json)
    - echo "ECR_MITUP_REPO_URI=$ECR_MITUP_REPO_URI" >> dotenv
    - echo "ECR_MIGRATIONS_REPO_URI=$ECR_MIGRATIONS_REPO_URI" >> dotenv
    - echo "BOT_IMAGE_TAG=$ECR_MITUP_REPO_URI:ci-$CI_COMMIT_SHORT_SHA" >> dotenv

  artifacts:
    reports:
      dotenv: dotenv
    when: on_success
    expire_in: "30 days"

config-staging:
  <<: *aws-env-config
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

config-prod:
  <<: *aws-env-config
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "release"

.push-ecr: &push-ecr
  stage: push-ecr
  <<: *tokens
  before_script:
    *aws-prep
  <<: *kaniko

## ------------- Push to staging --------------
push-bot-tagged-staging:
  <<: *push-ecr
  environment:
    name: staging
  variables:
    DOCKERFILE: Dockerfile
    PUSH_DESTINATION: $BOT_IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

push-bot-latest-staging:
  extends: push-bot-tagged-staging
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-staging:
  extends: push-bot-tagged-staging
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

## ------------- Push to prod --------------
push-bot-tagged-prod:
  # We can reuse the one for staging and change the environment
  extends: push-bot-tagged-staging
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "release"

push-bot-latest-prod:
  extends: push-bot-tagged-prod
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-prod:
  extends: push-bot-tagged-prod
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

# --------------------
# Deploy
# ---------------------
.migrate-and-deploy: &deploy
  # This job will first run the migrations on the database and the update ECS
  stage: deploy
  image:
    name: public.ecr.aws/aws-cli/aws-cli
    entrypoint: [""]
  <<: *tokens
  before_script:
    *aws-prep
  script:
    - yum install jq -y
    - |
      echo '{"action": "upgrade", "revision": "head"}' > payload.json
    - aws lambda invoke
      --function-name MitupMigrationsLambda
      --payload file://payload.json
      --region eu-west-1
      --cli-binary-format raw-in-base64-out
      inoke_output > response.json
    # Fail if lambda did not run
    - test $(jq '.StatusCode' response.json) -eq 200
    # Get the task definition
    - aws ecs describe-task-definition --region eu-west-1 --task-definition mitup > task_definition.json
    # Replace the tag to be used and store the task definition json
    - |
      jq -c --arg IMAGE "$BOT_IMAGE_TAG" '.taskDefinition.containerDefinitions[0].image = $IMAGE | {containerDefinitions: .taskDefinition.containerDefinitions, executionRoleArn: .taskDefinition.executionRoleArn}' task_definition.json > new_task.json
    # Register the new task definition
    - aws ecs register-task-definition --region eu-west-1 --family mitup --cli-input-json file://new_task.json
    - aws ecs update-service --region eu-west-1 --cluster mitup --service mitup --task-definition mitup


## -------------- Deploy staging ---------------
deploy-staging:
  # This job will first run the migrations on the database and the update ECS
  <<: *deploy
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

## -------------- Deploy prod ---------------
deploy-production:
  # This job will first run the migrations on the database and the update ECS
  <<: *deploy
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "release"

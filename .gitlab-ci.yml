# Custom image created for CI/CD purposes from Dockerfile.ci
image: registry.gitlab.com/meetupbot/mitup-telegram-bot/ci-python

# Templates for security and and code analysis
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Global variables for all jobs
variables:
  # Exclude paths for SAST analysis
  SAST_EXCLUDED_PATHS: "tests, .hatch"

# Only run in MergeRequests, tags and default branch
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "release"

.deploy-rules: &deploy-rules
  changes:
    - mitup_bot/**/*
    - dev/docker/Dockerfile
    - pyproject.toml

# Utilize web identity federation to allow AWS to perform STS calls on our behalf
.aws-prep: &aws-prep
  - |
    mkdir -p ~/.aws
    mkdir -p /tmp
    echo "${OIDC_TOKEN}" > /tmp/web_identity_token
    echo -e "[profile default]\nrole_arn=${SERVICE_CI_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config

.tokens: &tokens
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service

# Default cache for Hatch environments
cache:
  key: $CI_COMMIT_SHORT_SHA
  paths:
    - .hatch

# This is a GitLab provided job, no need to configure it
sast:
  stage: analysis

stages:
  - analysis
  - build-ci
  - test
  - prepare-deployment
  - push-ecr
  - deploy
  - documentation
  - validate

preparation:
  stage: build-ci
  script:
    - python --version
    - pip --version
    - hatch --version
    # Trigger dev environment to cache it
    - hatch run dev:echo
    - hatch run dev:pip list --local

build-translations:
  stage: build-ci
  script:
    - hatch run dev:build-locales
  artifacts:
    when: on_success
    access: none
    expire_in: "1 day"
    paths:
      - mitup_bot/locales

test:
  stage: test
  script: hatch run dev:test-cov
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  dependencies:
    - build-translations
  artifacts:
    when: always # Important to get reports when test fail
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

format-check:
  stage: test
  script: hatch run dev:format-check
  needs: [preparation]

linter:
  stage: test
  script: hatch run dev:lint
  needs: [preparation]

type-check:
  stage: test
  script: hatch run dev:type-check
  needs: [preparation]

validate-migrations:
  stage: test
  script: hatch run dev:validate-migrations
  needs: [preparation]

validate-locales:
  # This just validates that all messages in code are present in the translations english file
  stage: test
  script: hatch run dev:validate-locales
  needs: [preparation]

sourcery-review:
  stage: test
  script:
    - hatch run dev:mr-sourcery
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_EVENT_TYPE != 'merge_train'

# --------------------
# Docker build and push images
# ---------------------
.kaniko-build-push: &kaniko
  image:
    name: gcr.io/kaniko-project/executor:v1.23.1-debug
    entrypoint: [""]
  script:
    - echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}"
      --destination "${PUSH_DESTINATION}"

build-docker-ci:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python"
  <<: *kaniko
  rules:
    - if: $CI_COMMIT_TAG
    # When requested adding [build-ci] to the commit message
    - if: $CI_COMMIT_TITLE =~ /\[build-ci\]/
    # If no rule matched yet, allow building manually anytime that is needed
    - when: manual
      allow_failure: true

.aws-config: &aws-env-config
  stage: prepare-deployment
  <<: *tokens
  before_script: *aws-prep
  script:
    - aws ecr describe-repositories --region eu-west-1 > describe_response.json
    - ECR_MITUP_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "mitup") | .repositoryUri' describe_response.json)
    - ECR_MIGRATIONS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrations-lambda") | .repositoryUri' describe_response.json)
    - echo "ECR_MITUP_REPO_URI=$ECR_MITUP_REPO_URI" >> dotenv
    - echo "ECR_MIGRATIONS_REPO_URI=$ECR_MIGRATIONS_REPO_URI" >> dotenv
    - echo "BOT_IMAGE_TAG=$ECR_MITUP_REPO_URI:ci-$CI_COMMIT_SHORT_SHA" >> dotenv
    - echo "MIGRATIONS_IMAGE_TAG=$ECR_MIGRATIONS_REPO_URI:ci-$CI_COMMIT_SHORT_SHA" >> dotenv

  artifacts:
    reports:
      dotenv: dotenv
    when: on_success
    expire_in: "30 days"

config-staging:
  <<: *aws-env-config
  resource_group: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *deploy-rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: always

config-prod:
  <<: *aws-env-config
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

build-docs:
  stage: prepare-deployment
  script:
    - hatch run dev:build-docs
  artifacts:
    paths:
      - site
    expire_in: 1 day
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    # Only run if the doc files change
    - changes:
      - docs/**/*
      - mkdocs.yml

.push-ecr: &push-ecr
  stage: push-ecr
  <<: *tokens
  before_script: *aws-prep
  <<: *kaniko
  dependencies:
    - build-translations

## ------------- Push to staging --------------
push-bot-tagged-staging:
  <<: *push-ecr
  resource_group: bot-tagged-staging
  environment:
    name: staging
  variables:
    DOCKERFILE: Dockerfile
    PUSH_DESTINATION: $BOT_IMAGE_TAG
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *deploy-rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: always

push-bot-latest-staging:
  extends: push-bot-tagged-staging
  resource_group: bot-latest-staging
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-staging:
  extends: push-bot-tagged-staging
  resource_group: migrations-tagged-staging
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${MIGRATIONS_IMAGE_TAG}"

push-migrations-latest-staging:
  extends: push-migrations-lambda-staging
  resource_group: migrations-latest-staging
  variables:
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

## ------------- Push to prod --------------
push-bot-tagged-prod:
  # We can reuse the one for staging and change the environment
  extends: push-bot-tagged-staging
  resource_group: bot-tagged-prod
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

push-bot-latest-prod:
  extends: push-bot-tagged-prod
  resource_group: bot-latest-prod
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-prod:
  extends: push-bot-tagged-prod
  resource_group: migrations-tagged-prod
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${MIGRATIONS_IMAGE_TAG}"

push-migrations-latest-prod:
  extends: push-migrations-lambda-prod
  resource_group: migrations-latest-prod
  variables:
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

# --------------------
# Deploy
# ---------------------
.migrate-and-deploy:
  &deploy # This job will first run the migrations on the database and the update ECS
  stage: deploy
  <<: *tokens
  before_script: *aws-prep
  script:
    - hatch run dev:deploy
      --migrations-image $MIGRATIONS_IMAGE_TAG
      --bot-image $BOT_IMAGE_TAG

## -------------- Deploy staging ---------------
deploy-staging:
  # This job will first run the migrations on the database and the update ECS
  <<: *deploy
  resource_group: deploy-staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *deploy-rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: always

## -------------- Deploy prod ---------------
deploy-production:
  # This job will first run the migrations on the database and the update ECS
  <<: *deploy
  resource_group: deploy-production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"


## -------------- Documentation ---------------
# Run after deploy to be sure that documentation is not updated until the bot has been updated
.push-docs: &push-docs
  stage: documentation
  dependencies:
    # Get artifacts from build-docs job
    - build-docs
  <<: *tokens
  before_script: *aws-prep
  script:
    - hatch run dev:push-docs

push-docs-staging:
  <<: *push-docs
  resource_group: docs-staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      # Only run if in the default branch and the doc files change
      changes:
        - docs/**/*
        - mkdocs.yml

push-docs-production:
  <<: *push-docs
  resource_group: docs-production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

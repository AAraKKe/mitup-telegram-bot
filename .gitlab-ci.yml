# Main GitLab CI configuration file that includes all the components
# Split into multiple files for better organization and maintainability

# Include all component files
include:
  # Base configuration (must be first so other files can reference shared definitions)
  - local: .gitlab/ci/base.yml
  # Update Renovate configuration
  - local: .gitlab/ci/update-renovate.yml
  # Testing and validation
  - local: .gitlab/ci/test.yml
  # Docker build and push
  - local: .gitlab/ci/docker.yml
  # Configuring the aws credentials and the ECR URIs
  - local: .gitlab/ci/deploy-config.yml
  # ECR push
  - local: .gitlab/ci/ecr-push.yml
  # Deployment
  - local: .gitlab/ci/deploy.yml
  # Documentation
  - local: .gitlab/ci/docs.yml
  # Security templates
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

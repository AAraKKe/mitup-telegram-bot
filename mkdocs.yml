site_name: Mitup Telegram Bot
site_url: https://mitup.social
repo_url: https://gitlab.com/meetupbot/mitup-telegram-bot
repo_name: MitupBot/mitup-telegram-bot
nav:
  - MitupBot: index.md
  - User Guide:
    - Getting Started: user-guide/getting_started.md
    - Main Menu: user-guide/main_menu.md
    - Mitup Configuration: user-guide/configuration.md
    - Create a Meeting: user-guide/create_meeting.md
    - Configure a Meeting: user-guide/configure_meeting.md
    - Meeting Lifecycle: user-guide/meeting_lifecycle.md
  - FAQ:
    - Privacy: faq/privacy.md
  - Collaborate:
    - Being a supporter: collaborate/supporter.md
    - Donation: collaborate/donation.md
    - Become a Translator: collaborate/translator.md
    - Code Contributor: collaborate/code_contributor.md
    - Code of Conduct: collaborate/code_of_conduct.md
  - Code Contributor:
    - Setup: contribute/setup.md
    - Making Contributions: contribute/making_contributions.md
    - Local Validation: contribute/local_validation.md
    - Commit Message Format: contribute/commit_message_format.md
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  icon:
    repo: fontawesome/brands/gitlab
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.tracking
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.betterem
  - toc:
      permalink: true
      title: On this page
      permalink_title: Link to this section
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/stylesheets/main.css
extra:
  social:
    - icon: fontawesome/brands/telegram
      name: Bot
      link: https://t.me/mitupbot

# This is a sample configuration file use to supply configuration to the project.
#
# The main interface to read configuration values is `mitup_bot.config.Config` and supports
# different configuration providers. The TOML files can be used with the TomlConfigProviders.
#
# The following sections are sample values for all the supported configuration options.
#
# IMPORTANT: copy this file to `mitup_bot/environments/dev.toml` before modifying values in it.
#            You can keep the `dev.toml` file locally with any configuration you need and is
#            ignored by git.

[bot]
# Telegram bot configuration related with API configuration as well as internal configuration
# of the bot related features of the telegram-bot package
# Secret token. Get one through BothFather and add it here.
token = "123123123987987987"
# Cap on updates the bot processes concurrently. 1 keeps update handling strictly
# sequential. Must fit the db pool: concurrent_updates <= pool_size + max_overflow - 2
# (headroom for the job queue and reconcile transactions); startup fails otherwise.
# Optional; defaults to 1 when omitted.
concurrent_updates = 1

[db]
# Database connection configuration
username = "mitupbot"
database = "mitup"
password = "12345pass"
port = "5432"
url = "postgres"
# Connection pool sizing for the bot engine.
# Optional; the values below are the defaults when omitted.
pool_size = 5
max_overflow = 10
# Seconds to wait for a pooled connection before failing.
pool_timeout = 30
# Emit connection-pool metrics (in-use gauge, checkout wait time, pool-timeout counter).
# Optional; defaults to false. Enabled in deployed services via
# MITUPBOT__DB__POOL_METRICS_ENABLED=true so a revert stays config-only.
pool_metrics_enabled = false

[app]
# MitupBot App configuration.
# Run mode can be set to 2 different values:
# 1. polling -> will poll for updates as much as possible
# 2. webhook -> Telegram will send updates to a webhook where the app
#               should be listining. For this to work the bot to which
#               the supplied tocken belongs needs to have a webhook properly
#               configured.
run_mode = "polling"
# Root log level. One of: CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET.
# Optional; defaults to "INFO" when omitted.
log_level = "INFO"

[google_api]
# Google API configuration
gmaps_geocode_key = "key_to_use_geocode_api"
gmaps_timezone_key = "key_to_use_timezone_api"

[metrics]
namespace = "MitupBot"
environment = "local"

[limits]
# Free-tier limits that premium (Patreon) users have raised. This whole section is OPTIONAL:
# every field is defaulted, so the values below are what the bot uses when the section is omitted.
# Tune a value in a deployed service via MITUPBOT__LIMITS__<KEY> so a revert stays config-only.
# Active meetings a user may own at once (enforced at creation and reactivation).
free_active_meetings = 5
premium_active_meetings = 50
# How many days ahead a meeting's start date may be set.
free_scheduling_horizon_days = 90
premium_scheduling_horizon_days = 365
# Free-tier per-meeting participant capacity, applied as an effective cap on joins and waiting-list
# promotions (a free owner's "no limit" resolves to this). Premium owners are uncapped.
free_participant_capacity = 20

[patreon]
# Patreon OAuth integration. This whole section is OPTIONAL — omit it entirely and the bot
# starts without Patreon support. If you include it, it is all-or-nothing: every key below
# must be set or config loading fails naming the missing ones.
# OAuth app credentials from https://www.patreon.com/portal/registration/register-clients
client_id = "patreon_client_id"
client_secret = "patreon_client_secret"
# Campaign whose membership the bot checks against.
campaign_id = "1234567"
# Must exactly match the redirect URI registered on the Patreon client.
redirect_uri = "https://your.bot.domain/patreon/callback"
# SEED VALUES ONLY for the creator token pair. The daily refresh job persists the live pair
# in the DB, which is the source of truth after the first refresh; these seeds are re-adopted
# only when their value changes, so rotating the credential is just replacing these values.
creator_access_token = "patreon_creator_access_token"
creator_refresh_token = "patreon_creator_refresh_token"
# Separate Fernet keys (different blast radius): one signs the OAuth `state` parameter, the
# other encrypts Patreon tokens at rest in the DB.
state_secret = "fernet_key_for_oauth_state"
encryption_key = "fernet_key_for_token_encryption"

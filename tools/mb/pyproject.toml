[project]
name = "mb"
version = "0.1.0"
description = "Developer CLI for the mitup-telegram-bot repository"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6",
    "rich>=13",
    # mb owns the dev/CI tooling natively and introspects the bot's message
    # catalog and alembic graph; it is dev-only, so importing the bot is a
    # legitimate edge (see issue #251).
    "mitup-bot",
    # deploy/publish-docs drive AWS directly (boto3 provided by the Lambda
    # runtime in production, so it is not a bot runtime dependency).
    "boto3~=1.34",
    "boto3-stubs[cloudfront,ecs,lambda]",
]

[project.scripts]
mb = "mb.main:app"

[tool.uv.sources]
mitup-bot = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mb"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
root = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mb"
version = "0.1.0"
description = "Developer CLI for the mitup-telegram-bot repository"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "httpx==0.28.1",
    "pyyaml>=6",
    "rich>=13",
    "pydantic==2.13.4",
    # mb owns the dev/CI tooling natively and introspects the bot's message
    # catalog (utils.messages, in mitup-telegram) and the version/i18n engine
    # (mitup-core); it is dev-only, so importing the bot layers is a legitimate
    # edge (see issue #251).
    "mitup-core",
    "mitup-telegram",
    # deploy/publish-docs drive AWS directly (boto3 provided by the Lambda
    # runtime in production, so it is not a bot runtime dependency).
    "boto3~=1.34",
    "boto3-stubs[cloudfront,ecs,lambda]",
]

[project.scripts]
mb = "mb.main:app"

[tool.uv.sources]
mitup-core = { workspace = true }
mitup-telegram = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mb"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
root = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

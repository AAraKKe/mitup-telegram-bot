[project]
name = "mitup-rails-migration"
version = "0.0.1"
description = "One-off developer tool that migrates data from the legacy Rails bot Postgres into the new schema"
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "boto3~=1.34",
    "psycopg[binary]==3.3.4",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "mitup-core",
    "mitup-data",
    "mitup-monitoring",
]

[project.scripts]
mitup-rails-migration = "mitup_bot.migration.cli:main"

[tool.uv.sources]
mitup-core = { workspace = true }
mitup-data = { workspace = true }
mitup-monitoring = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mitup_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

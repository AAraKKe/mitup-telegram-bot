.push-ecr: &push-ecr
  stage: push-ecr
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  # Use our CI image that has both Docker CLI and AWS CLI
  image: ${CI_REGISTRY_IMAGE}/ci-python
  services:
    - docker:29-dind
  variables:
    # Enable BuildKit for better multi-stage builds and caching
    DOCKER_BUILDKIT: "1"
    # Disable TLS for dind communication within GitLab runner
    DOCKER_TLS_CERTDIR: ""
    # Connect to docker:dind service
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # Authenticate with this job's own OIDC token: the job may queue for a long time behind a
    # deploy bake, so it must not reuse credentials issued to an earlier job.
    - !reference [.aws-prep]
    # Login to AWS ECR
    - ECR_REGISTRY=$(echo "$PUSH_DESTINATION" | cut -d'/' -f1)
    - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    # Create and bootstrap buildx builder
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap
  script:
    - |
      set -e
      COMMIT_DESTINATION=$PUSH_DESTINATION
      IMAGE_BASE_URI=$(echo "$PUSH_DESTINATION" | cut -d':' -f1)
      CACHE_TAG="${IMAGE_BASE_URI}:build-cache"
      LATEST_TAG="${IMAGE_BASE_URI}:latest"

      echo "Building $DOCKERFILE and pushing to ${COMMIT_DESTINATION} and ${LATEST_TAG}..."

      docker buildx build \
        --platform linux/amd64 \
        --file "${CI_PROJECT_DIR}/${DOCKERFILE}" \
        --tag "${COMMIT_DESTINATION}" \
        --tag "${LATEST_TAG}" \
        --cache-from "type=registry,ref=${CACHE_TAG}" \
        --cache-to "type=registry,ref=${CACHE_TAG},mode=max" \
        --provenance=false \
        --push \
        --progress=plain \
        "${CI_PROJECT_DIR}"
  after_script:
    - docker buildx rm builder

# These push jobs stay grouped rather than per-path: a deploy resolves every image by the current
# commit sha (see deploy-config.yml), so each :ci-<sha> tag must exist whenever a deploy runs. The
# registry build-cache makes the unchanged images near-instant to re-push. Strict per-path gating
# (build only the changed app's image) lives on the MR-only validate-docker-build jobs, where there
# is no deploy to satisfy.
#
# The events image is a first-class deployable alongside bot/migrations/alarm: validated on MRs
# (validate-docker-events), pushed here, and deployed by `mb deploy --events-image` (deploy.yml).
# HARD PREREQUISITE: the `events` ECR repo (created by mitup-infra !43) must be merged and applied
# before this MR merges, so the push destination resolves (see deploy-config.yml).

## -------------- Push to staging ---------------
push-bot-tagged-staging:
  extends: .push-ecr
  resource_group: bot-tagged-staging
  environment:
    name: staging
  dependencies:
    - build-translations
    - config-staging
  variables:
    DOCKERFILE: apps/bot/Dockerfile
    PUSH_DESTINATION: $BOT_IMAGE_TAG
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: !reference [.deployment-files]
      when: on_success

push-migrations-lambda-staging:
  extends: push-bot-tagged-staging
  resource_group: migrations-tagged-staging
  variables:
    DOCKERFILE: apps/lambda-migrations/Dockerfile
    PUSH_DESTINATION: $MIGRATIONS_IMAGE_TAG

push-alarm-action-lambda-staging:
  extends: push-bot-tagged-staging
  resource_group: alarm-action-tagged-staging
  variables:
    DOCKERFILE: apps/lambda-alarm/Dockerfile
    PUSH_DESTINATION: $ALARM_ACTION_IMAGE_TAG

push-events-tagged-staging:
  extends: push-bot-tagged-staging
  resource_group: events-tagged-staging
  variables:
    DOCKERFILE: apps/events/Dockerfile
    PUSH_DESTINATION: $EVENTS_IMAGE_TAG

## ------------- Push to prod --------------
push-bot-tagged-prod:
  # We can reuse the one for staging and change the environment
  extends: push-bot-tagged-staging
  resource_group: bot-tagged-prod
  environment:
    name: production
  dependencies:
    - build-translations
    - config-staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

push-migrations-lambda-prod:
  extends: push-bot-tagged-prod
  resource_group: migrations-tagged-prod
  variables:
    DOCKERFILE: apps/lambda-migrations/Dockerfile
    PUSH_DESTINATION: $MIGRATIONS_IMAGE_TAG

push-alarm-action-lambda-prod:
  extends: push-bot-tagged-prod
  resource_group: alarm-action-tagged-prod
  variables:
    DOCKERFILE: apps/lambda-alarm/Dockerfile
    PUSH_DESTINATION: $ALARM_ACTION_IMAGE_TAG

push-events-tagged-prod:
  extends: push-bot-tagged-prod
  resource_group: events-tagged-prod
  variables:
    DOCKERFILE: apps/events/Dockerfile
    PUSH_DESTINATION: $EVENTS_IMAGE_TAG

.push-ecr: &push-ecr
  stage: push-ecr
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  # Use our CI image that has both Docker CLI and AWS CLI
  image: ${CI_REGISTRY_IMAGE}/ci-python
  services:
    - docker:27-dind
  variables:
    # Enable BuildKit for better multi-stage builds and caching
    DOCKER_BUILDKIT: "1"
    # Disable TLS for dind communication within GitLab runner
    DOCKER_TLS_CERTDIR: ""
    # Connect to docker:dind service
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # Setup AWS credentials using OIDC
    - mkdir -p ~/.aws
    - cp ${CI_PROJECT_DIR}/aws-config ~/.aws/config
    # Extract ECR registry domain from destination
    - export ECR_REGISTRY=$(echo $PUSH_DESTINATION | cut -d'/' -f1)
    - export AWS_SDK_LOAD_CONFIG=1
    - export AWS_REGION=eu-west-1
    # Authenticate Docker to ECR
    - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
    # Create and bootstrap buildx builder
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap
  script:
    - echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
    - export CACHE_IMAGE=$(echo $PUSH_DESTINATION | cut -d':' -f1):latest
    - docker buildx build
      --platform linux/amd64
      --file "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}"
      --tag "${PUSH_DESTINATION}"
      --cache-from "type=registry,ref=${CACHE_IMAGE}"
      --cache-to "type=registry,ref=${CACHE_IMAGE},mode=max"
      --provenance=false
      --push
      --progress=plain
      "${CI_PROJECT_DIR}"
  after_script:
    - docker buildx rm builder

## -------------- Push to staging ---------------
push-bot-tagged-staging:
  extends: .push-ecr
  resource_group: bot-tagged-staging
  environment:
    name: staging
  dependencies:
    - build-translations
    - config-staging
  variables:
    DOCKERFILE: Dockerfile
    PUSH_DESTINATION: $BOT_IMAGE_TAG
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: !reference [.deployment-files]
      when: on_success

push-bot-latest-staging:
  extends: push-bot-tagged-staging
  resource_group: bot-latest-staging
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-staging:
  extends: push-bot-tagged-staging
  resource_group: migrations-tagged-staging
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${MIGRATIONS_IMAGE_TAG}"

push-migrations-latest-staging:
  extends: push-migrations-lambda-staging
  resource_group: migrations-latest-staging
  variables:
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

## ------------- Push to prod --------------
push-bot-tagged-prod:
  # We can reuse the one for staging and change the environment
  extends: push-bot-tagged-staging
  resource_group: bot-tagged-prod
  environment:
    name: production
  dependencies:
    - build-translations
    - config-staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

push-bot-latest-prod:
  extends: push-bot-tagged-prod
  resource_group: bot-latest-prod
  variables:
    PUSH_DESTINATION: "${ECR_MITUP_REPO_URI}:latest"

push-migrations-lambda-prod:
  extends: push-bot-tagged-prod
  resource_group: migrations-tagged-prod
  variables:
    DOCKERFILE: Dockerfile.migrations
    PUSH_DESTINATION: "${MIGRATIONS_IMAGE_TAG}"

push-migrations-latest-prod:
  extends: push-migrations-lambda-prod
  resource_group: migrations-latest-prod
  variables:
    PUSH_DESTINATION: "${ECR_MIGRATIONS_REPO_URI}:latest"

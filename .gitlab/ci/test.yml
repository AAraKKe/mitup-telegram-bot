preparation:
  stage: build
  script:
    - echo "Using CI image tag ${CI_IMAGE_TAG}"
    - python --version
    - pip --version
    - hatch --version
    - hatch run dev:uv tree
    - hatch env find
    - echo $PWD

build-translations:
  stage: build
  script:
    - hatch run dev:build-locales
  artifacts:
    when: on_success
    access: none
    expire_in: "1 day"
    paths:
      - mitup_bot/locales

test:
  stage: test
  script: hatch run dev:test-cov
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  dependencies:
    - build-translations
  needs: [preparation, build-translations]
  artifacts:
    when: always # Important to get reports when test fail
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    # Run always in master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # run only when the mitupbot, dev or tests folders are updated
    - changes:
        - mitup_bot/**/*
        - pyproject.toml
        - dev/**/*
        - tests/**/*

format-check:
  stage: test
  script: hatch run dev:format-check
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

linter:
  stage: test
  script: hatch run dev:lint
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

type-check:
  stage: test
  script: |
    hatch run dev:ty version
    hatch run dev:type-check
  needs: [preparation]

check-ty-ignores:
  stage: test
  script:
    - hatch run dev:python bin/check_ty_ignores.py
  needs: [preparation]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate-migrations:
  stage: test
  script: hatch run dev:validate-migrations
  needs: [preparation]

validate-locales:
  # This just validates that all messages in code are present in the translations english file
  stage: test
  script:
    - hatch run dev:validate-locales

validate-local-setup:
  # This job validates the setup process for new contributors
  image: python:3.14-bookworm
  stage: test
  needs: [] # Run immediately without waiting for previous stages
  script:
    - ./bin/local-setup.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

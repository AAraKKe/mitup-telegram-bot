preparation:
  stage: build
  script:
    - echo "Using CI image tag ${CI_IMAGE_TAG}"
    - python --version
    - uv --version
    - time uv sync --frozen
    # Guard against a stale lock: `uv sync --frozen` installs from uv.lock without checking it
    # against pyproject.toml, so a forgotten `uv sync` after a dependency edit would pass silently.
    # `uv lock --check` fails when the committed lock is out of date with any workspace pyproject.
    - uv lock --check
    - uv tree
    - echo $PWD

build-translations:
  stage: build
  script:
    - uv run mb locales build
  artifacts:
    when: on_success
    access: none
    expire_in: "1 day"
    paths:
      - libs/core/mitup_bot/locales

validate-ci-languages:
  stage: build
  script: uv run mb ci check-languages

# The whole suite runs from one `parallel:matrix` job. `mb test --member $TARGET` maps a member
# to its `tests/<name>` subtree (tests/ mirrors the member layout), so there is no trigger list to
# keep in sync. Language-rendering members (apps/bot, libs/telegram, apps/events) contribute a
# `-m "not i18n"` single run plus a `-m i18n` run per supported language; every other member runs
# once. One broad trigger (below) gates the job: it errs toward running the suite so a new test is
# never silently dropped by an out-of-date trigger list.
.test-rules: &test_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - changes:
      - apps/**/*
      - libs/**/*
      - tools/**/*
      - tests/**/*
      - uv.lock
      - pyproject.toml
      - .gitlab/ci/test.yml

test-suite:
  stage: test
  needs: [preparation, build-translations]
  dependencies:
    - build-translations
  parallel:
    matrix:
      - TARGET:
          - libs/core
          - libs/monitoring
          - libs/data
          - libs/patreon
          - apps/lambda-migrations
          - apps/lambda-alarm
          - tools/rails-migration
          - tools/mb
      - TARGET:
          - apps/bot
          - libs/telegram
          - apps/events
        MARKER: ["not i18n"]
      - TARGET:
          - apps/bot
          - libs/telegram
          - apps/events
        LOCALE: [en, es_ES, gl_ES, de_DE, pt_BR, it_IT]
  # Each entry writes its coverage to a uniquely named raw data file and does not report a
  # percentage; `coverage-report` combines all of them into the single project number so partial
  # per-entry slices are never averaged.
  variables:
    COVERAGE_FILE: ".coverage.${CI_JOB_ID}"
  script:
    - |
      if [ -n "${LOCALE:-}" ]; then
        uv run mb test --member "$TARGET" --lang "$LOCALE" -m i18n --cov --junit report.xml
      elif [ -n "${MARKER:-}" ]; then
        uv run mb test --member "$TARGET" -m "$MARKER" --cov --junit report.xml
      else
        uv run mb test --member "$TARGET" --cov --junit report.xml
      fi
  artifacts:
    when: always # Important to get reports when tests fail
    paths:
      - .coverage.*
    reports:
      junit: report.xml
  rules: *test_rules

coverage-report:
  stage: test
  needs: [test-suite, test-db]
  script:
    - uv run coverage combine .coverage.*
    - uv run coverage xml -o coverage.xml
    - uv run coverage report
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules: *test_rules

format-check:
  stage: test
  script: uv run mb format --check
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

linter:
  stage: test
  script: uv run mb lint
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

type-check:
  stage: test
  script: uv run mb typecheck
  needs: [preparation]

check-ty-ignores:
  stage: test
  script:
    - uv run mb ci check-ty-ignores
  needs: [preparation]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate-migrations:
  stage: test
  script: uv run mb db migrate validate
  needs: [preparation]

check-import-isolation:
  # Proves each workspace library imports with only its own declared dependencies,
  # so a lib never silently leans on a dependency it does not declare.
  stage: test
  script: uv run mb ci check-import-isolation
  needs: [preparation]

validate-ids:
  # Validates that all messages in code are present in the English translations file
  stage: test
  script:
    - uv run mb locales validate-ids

validate-locales:
  # Validates that all non-English .po files contain the same msgids as English
  stage: test
  script:
    - uv run mb locales validate
  dependencies:
    - build-translations
  needs: [preparation, build-translations]

test-db:
  stage: test
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COVERAGE_FILE: ".coverage.${CI_JOB_ID}"
  # `mb test --db --cov` runs the db suite serially with coverage; its raw data file feeds the
  # combined `coverage-report`. The JUnit report flag rides the passthrough.
  script:
    - uv run mb test --db --cov tests/data/db_behavior/ --junitxml=report.xml
  needs: [preparation]
  artifacts:
    when: always
    paths:
      - .coverage.*
    reports:
      junit: report.xml
  rules: *test_rules

validate-local-setup:
  # This job validates the fresh-contributor bootstrap on a clean image:
  # install uv, sync the workspace, and prove the mb CLI answers.
  image: python:3.14-bookworm
  stage: test
  needs: [] # Run immediately without waiting for previous stages
  script:
    - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc gettext git
    - pip install --no-cache-dir uv
    - uv sync --frozen
    - uv run mb --help
    - 'echo "feat(ci) smoke-test the commit hook" > commit-msg.txt && ! uv run mb ci check-commit commit-msg.txt'
    - 'echo "feat(ci): smoke-test the commit hook" > commit-msg.txt && uv run mb ci check-commit commit-msg.txt'
    # The emojified result must re-validate byte-for-byte (idempotent re-run / --amend).
    - 'cp commit-msg.txt commit-msg.before && uv run mb ci check-commit commit-msg.txt && cmp commit-msg.txt commit-msg.before'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

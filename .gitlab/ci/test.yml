preparation:
  stage: build
  script:
    - echo "Using CI image tag ${CI_IMAGE_TAG}"
    - python --version
    - pip --version
    - hatch --version
    - hatch run dev:uv tree
    - hatch env find
    - echo $PWD

build-translations:
  stage: build
  script:
    - hatch run dev:build-locales
  artifacts:
    when: on_success
    access: none
    expire_in: "1 day"
    paths:
      - mitup_bot/locales

validate-ci-languages:
  stage: build
  needs: [{job: build-docker-ci, optional: true}]
  script: hatch run dev:python bin/check_ci_languages.py

test:
  stage: test
  parallel:
    matrix:
      - LANG: [en, es_ES, gl_ES, de_DE, pt_BR, it_IT]
  script: hatch run dev:test-cov -- tests --lang $LANG
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  dependencies:
    - build-translations
  needs: [preparation, build-translations, validate-ci-languages]
  artifacts:
    when: always # Important to get reports when test fail
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    # Run always in master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # run only when the mitupbot, dev or tests folders are updated
    - changes:
        - mitup_bot/**/*
        - pyproject.toml
        - dev/**/*
        - tests/**/*

format-check:
  stage: test
  script: hatch run dev:format-check
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

linter:
  stage: test
  script: hatch run dev:lint
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

type-check:
  stage: test
  script: |
    hatch run dev:ty version
    hatch run dev:type-check
  needs: [preparation]

check-ty-ignores:
  stage: test
  script:
    - hatch run dev:python bin/check_ty_ignores.py
  needs: [preparation]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate-migrations:
  stage: test
  script: hatch run dev:validate-migrations
  needs: [preparation]

validate-ids:
  # Validates that all messages in code are present in the English translations file
  stage: test
  script:
    - hatch run dev:validate-ids

validate-locales:
  # Validates that all non-English .po files contain the same msgids as English
  stage: test
  script:
    - hatch run dev:validate-locales
  dependencies:
    - build-translations
  needs: [preparation, build-translations]

test-db:
  stage: test
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - hatch run dev:test-db
  needs: [preparation]
  artifacts:
    when: always
    reports:
      junit: report.xml

validate-local-setup:
  # This job validates the setup process for new contributors
  image: python:3.14-bookworm
  stage: test
  needs: [] # Run immediately without waiting for previous stages
  script:
    - ./bin/local-setup.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

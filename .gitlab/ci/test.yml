preparation:
  stage: build
  script:
    - echo "Using CI image tag ${CI_IMAGE_TAG}"
    - python --version
    - uv --version
    - time uv sync --frozen
    - uv tree
    - echo $PWD

build-translations:
  stage: build
  script:
    - uv run mb locales build
  artifacts:
    when: on_success
    access: none
    expire_in: "1 day"
    paths:
      - mitup_bot/locales

validate-ci-languages:
  stage: build
  script: uv run mb ci check-languages

test:
  stage: test
  parallel:
    matrix:
      - LANG: [en, es_ES, gl_ES, de_DE, pt_BR, it_IT]
  # Raw pytest instead of `mb test --cov`: this job needs the JUnit/Cobertura/JSON
  # report flags that the local-facing mb command deliberately leaves out.
  script:
    - uv run mb locales build
    - uv run pytest -n 4 --cov=mitup_bot --cov-report term-missing:skip-covered --cov-report xml:coverage.xml --junitxml=report.xml --json-report --json-report-file=report.json tests --lang $LANG
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  dependencies:
    - build-translations
  needs: [preparation, build-translations, validate-ci-languages]
  artifacts:
    when: always # Important to get reports when test fail
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    # Run always in master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # run only when the mitupbot, dev or tests folders are updated
    - changes:
        - mitup_bot/**/*
        - pyproject.toml
        - uv.lock
        - tools/**/*
        - dev/**/*
        - tests/**/*

format-check:
  stage: test
  script: uv run mb format --check
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

linter:
  stage: test
  script: uv run mb lint
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

type-check:
  stage: test
  script: |
    uv run ty version
    uv run mb typecheck
  needs: [preparation]

check-ty-ignores:
  stage: test
  script:
    - uv run mb ci check-ty-ignores
  needs: [preparation]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate-migrations:
  stage: test
  script: uv run mb db migrate validate
  needs: [preparation]

validate-ids:
  # Validates that all messages in code are present in the English translations file
  stage: test
  script:
    - uv run mitup translations validate-ids

validate-locales:
  # Validates that all non-English .po files contain the same msgids as English
  stage: test
  script:
    - uv run mb locales validate
  dependencies:
    - build-translations
  needs: [preparation, build-translations]

test-db:
  stage: test
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  # Raw pytest instead of `mb test --db`: this job needs the JUnit report flag
  # that the local-facing mb command deliberately leaves out.
  script:
    - uv run mb locales build
    - uv run pytest --db-tests --dist no --junitxml=report.xml tests/models/db_behavior/
  needs: [preparation]
  artifacts:
    when: always
    reports:
      junit: report.xml

validate-local-setup:
  # This job validates the fresh-contributor bootstrap on a clean image:
  # install uv, sync the workspace, and prove the mb CLI answers.
  image: python:3.14-bookworm
  stage: test
  needs: [] # Run immediately without waiting for previous stages
  script:
    - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc gettext git
    - pip install --no-cache-dir uv
    - uv sync --frozen
    - uv run mb --help
    - 'echo "feat(ci) smoke-test the commit hook" > commit-msg.txt && ! uv run mb ci check-commit commit-msg.txt'
    - 'echo "feat(ci): smoke-test the commit hook" > commit-msg.txt && uv run mb ci check-commit commit-msg.txt'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - when: on_success

# --------------------
# Deploy
# ---------------------
.migrate-and-deploy:
  &deploy # This job will first run the migrations on the database and the update ECS
  stage: deploy
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    # Authenticate with this job's own OIDC token: deploys can queue for a long time on the
    # resource group, so they must not reuse credentials issued to an earlier job.
    - !reference [.aws-prep]
    - uv run mb deploy
      --migrations-image $MIGRATIONS_IMAGE_TAG
      --bot-image $BOT_IMAGE_TAG
      --alarm-action-image $ALARM_ACTION_IMAGE_TAG
      --events-image $EVENTS_IMAGE_TAG

## -------------- Deploy ---------------
deploy:
  # This job will first run the migrations on the database and the update ECS
  extends: .migrate-and-deploy
  dependencies:
    - deploy-config
  resource_group: deploy
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/

## -------------- Refresh ---------------
# Manual button on the default-branch pipeline: re-rolls both ECS services onto their latest
# registered task definition (e.g. after an infra apply) without building images or migrating.
# `environment: production` is required — it is what makes the GitLab OIDC token carry the
# `environment`/`environment_protected` claims the infra OIDC trust keys on, so production must be a
# GitLab Protected Environment for the trust to grant access. No image tags, so no deploy-config dep.
deploy:refresh:
  stage: deploy
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  resource_group: deploy
  environment:
    name: production
  script:
    - !reference [.aws-prep]
    - uv run mb deploy --refresh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      # Without allow_failure, an unplayed manual job pins the pipeline status at 'manual'
      # instead of 'success' — which blocks `mb release`, since it requires a green pipeline.
      allow_failure: true

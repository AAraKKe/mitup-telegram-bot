# --------------------
# Deploy
# ---------------------
.migrate-and-deploy:
  &deploy # This job will first run the migrations on the database and the update ECS
  stage: deploy
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    - mkdir -p ~/.aws
    - cp ${CI_PROJECT_DIR}/aws-config ~/.aws/config
    - hatch run dev:deploy
      --migrations-image $MIGRATIONS_IMAGE_TAG
      --bot-image $BOT_IMAGE_TAG

## -------------- Deploy staging ---------------
deploy-staging:
  # This job will first run the migrations on the database and the update ECS
  extends: .migrate-and-deploy
  resource_group: deploy-staging
  dependencies:
    - config-staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *deployment-trigger-files

## -------------- Deploy prod ---------------
deploy-production:
  # This job will first run the migrations on the database and the update ECS
  extends: .migrate-and-deploy
  dependencies:
    - config-prod
  resource_group: deploy-production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   MITUP_GITLAB_API_TOKEN  - api-scope PAT of the Mitup GitLab Bot service account;
#                             resolves the account's name and commit email for the fix
#                             commit.
#   MITUP_GITLAB_PUSH_TOKEN - write_repository-scope PAT of the same account; pushes the
#                             fix back to the MR source branch. The committer-email push
#                             rule only accepts the pushing token owner's identity, which
#                             is why the fix commit cannot carry Renovate's.
auto-format:
  stage: pre-flight
  rules:
    # Only run in renovate branches on merge requests
    - if: '$CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//'
  script:
    - |
      set -e

      git fetch origin
      git checkout -b reformat origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}

      # Now that we are on the correct branch, get its latest commit message.
      SOURCE_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
      echo "Source commit message: ${SOURCE_COMMIT_MESSAGE}"

      # If the last commit was already a formatting fix, do nothing.
      # The job should succeed and the pipeline should continue.
      if [[ "${SOURCE_COMMIT_MESSAGE}" == *"Fix formatting after renovate update"* ]]; then
        echo "Last commit on source branch was a formatting fix. Nothing to do."
        exit 0
      fi

      # Otherwise, run the formatters
      uv run mb fix

      # Only proceed if there are changes to commit
      if ! git diff --quiet; then
        echo "Formatting changes detected. Committing as the push token's owner."

        # Install and configure pre-commit to ensure commit-msg hooks run
        pip install pre-commit
        pre-commit install
        pre-commit install --hook-type commit-msg

        # The committer-email push rule only accepts the pushing token owner's
        # identity, so resolve the service account's name and commit email.
        IDENTITY=$(curl --silent --fail --header "PRIVATE-TOKEN: ${MITUP_GITLAB_API_TOKEN}" "${CI_API_V4_URL}/user")
        COMMIT_USER_NAME=$(echo "${IDENTITY}" | python3 -c "import json, sys; print(json.load(sys.stdin)['name'])")
        COMMIT_USER_EMAIL=$(echo "${IDENTITY}" | python3 -c "import json, sys; u = json.load(sys.stdin); print(u.get('commit_email') or u['email'])")

        echo "Setting git user to '${COMMIT_USER_NAME} <${COMMIT_USER_EMAIL}>'"

        git config user.name "${COMMIT_USER_NAME}"
        git config user.email "${COMMIT_USER_EMAIL}"

        git add -A
        git commit -m "refactor: fix formatting after renovate update"

        # Push the changes back to the source branch using the push token
        git push https://oauth2:${MITUP_GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:"${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

        # If this has run, there is no point in running the rest of the pipeline
        echo "Successfully pushed formatting changes. Failing job to stop pipeline."
        exit 1
      else
        echo "No formatting changes needed."
        exit 0 # Exit successfully if no changes were needed
      fi
  variables:
    # GIT_STRATEGY: clone is required to have the git history to log and push
    GIT_STRATEGY: clone

# Custom image created for CI/CD purposes from Dockerfile.ci
# Uses dynamic tagging to allow MR-specific images when CI dependencies change
image: registry.gitlab.com/meetupbot/mitup-telegram-bot/ci-python:${CI_IMAGE_TAG}

# Global variables for all jobs
variables:
  # Exclude paths for SAST analysis
  SAST_EXCLUDED_PATHS: "tests"
  # GitLab renders ANSI colors in job logs; mb and pytest key their color output off this.
  # Animations stay off in CI regardless (mb only animates on an interactive TTY).
  FORCE_COLOR: "1"
  # Default CI image tag - can be overridden by workflow rules
  CI_IMAGE_TAG: "latest"

# Templates for security and and code analysis
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# When do we need to rebuild the CI docker image
.ci-docker-files: &ci-docker-files
  - dev/docker/Dockerfile.ci
  - pyproject.toml
  - uv.lock
  - tools/mb/pyproject.toml
  - libs/core/pyproject.toml
  - libs/monitoring/pyproject.toml
  - libs/data/pyproject.toml
  - libs/telegram/pyproject.toml
  - .gitlab-ci.yml
  - .gitlab/ci/docker.yml

# Centralized list of files that trigger deployment when changed
# Use !reference [.deployment-files] in rules to keep triggers consistent
.deployment-files: &deployment-files
  - mitup_bot/**/*
  - dev/docker/Dockerfile
  - dev/docker/Dockerfile.ci
  - dev/docker/Dockerfile.migrations
  - dev/docker/Dockerfile.migrate-rails
  - pyproject.toml
  # Include also gitlab yaml files related with deployments
  - .gitlab-ci.yml
  - .gitlab/ci/base.yml
  - .gitlab/ci/deploy.yml
  - .gitlab/ci/deploy-config.yml
  - .gitlab/ci/ecr-push.yml

# Centralized list of documentation files
# Use !reference [.docs-files] in rules for documentation changes
.docs-files: &docs-files
  - docs/**/*
  - zensical.toml
  # The CLI command that ships the site to S3 + CloudFront — changing how we
  # publish must re-trigger the docs pipeline even if no docs page changed.
  - mitup_bot/cli/commands/publish_docs.py
  # Include also gitlab yaml files related with documentation
  - .gitlab-ci.yml
  - .gitlab/ci/base.yml
  - .gitlab/ci/docs.yml
  - .gitlab/ci/deploy-config.yml

# Utilize web identity federation to allow AWS to perform STS calls on our behalf
.aws-prep: &aws-prep
  - |
    mkdir -p ~/.aws
    mkdir -p /tmp
    echo "${OIDC_TOKEN}" > /tmp/web_identity_token
    echo -e "[profile default]\nrole_arn=${SERVICE_CI_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config

# Only run in MergeRequests, tags and default branch
# Also sets CI_IMAGE_TAG dynamically based on whether CI dependencies changed
workflow:
  rules:
    # MR with CI changes - use MR-specific image
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.ci-docker-files]
      variables:
        CI_IMAGE_TAG: "mr-${CI_MERGE_REQUEST_IID}"
    # All other cases - use existing latest image (or build it if on main/release with CI changes)
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "release"'

# This is a GitLab provided job, no need to configure it
sast:
  stage: analysis

stages:
  - build-ci
  - pre-flight
  - analysis
  - build
  - test
  - prepare-deployment
  - push-ecr
  - deploy
  - documentation
  - validate

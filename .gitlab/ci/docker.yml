# --------------------
# Docker build and push images
# ---------------------
.docker-build-push: &docker-build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Enable BuildKit for better multi-stage builds and caching
    DOCKER_BUILDKIT: "1"
    # Disable TLS for dind communication within GitLab runner
    DOCKER_TLS_CERTDIR: ""
    # Connect to docker:dind service
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # Authenticate to GitLab Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Create and bootstrap buildx builder
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap
  script:
    - |
      set -e
      echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
      IMAGE_BASE_URI=$(echo "$PUSH_DESTINATION" | cut -d':' -f1)
      CACHE_TAG="${IMAGE_BASE_URI}:build-cache"

      docker buildx build \
        --file "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}" \
        --tag "${PUSH_DESTINATION}" \
        --cache-from "type=registry,ref=${CACHE_TAG}" \
        --cache-to "type=registry,ref=${CACHE_TAG},mode=max" \
        --push \
        --progress=plain \
        "${CI_PROJECT_DIR}"
  after_script:
    - docker buildx rm builder

build-docker-ci:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    # Push to the dynamically determined tag
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python:${CI_IMAGE_TAG}"
  extends: .docker-build-push
  rules:
    # Build automatically for MR-specific images (when CI files changed in MR)
    - if: '$CI_IMAGE_TAG =~ /^mr-/'
    # Build on main/release when CI files changed
    - if: '($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release")'
      changes: !reference [.ci-docker-files]
    # Allow manual trigger with [build-ci] in commit message
    - if: '$CI_COMMIT_TITLE =~ /\[build-ci\]/'
    # Manual fallback for any other case
    - when: manual
      allow_failure: true

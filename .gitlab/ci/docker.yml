# --------------------
# Docker build and push images
# ---------------------
.kaniko-build-push: &kaniko
  image:
    name: gcr.io/kaniko-project/executor:v1.23.1-debug
    entrypoint: [""]
  script:
    - echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}"
      --destination "${PUSH_DESTINATION}"

build-docker-ci:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python"
  extends: .kaniko-build-push
  rules:
    - if: $CI_COMMIT_TAG
    # When requested adding [build-ci] to the commit message
    - if: $CI_COMMIT_TITLE =~ /\[build-ci\]/
    # If the docker ci file has changed
    - changes:
      - dev/docker/Dockerfile.ci
    # If no rule matched yet, allow building manually anytime that is needed
    - when: manual
      allow_failure: true

.aws-config: &aws-env-config
  stage: prepare-deployment
  <<: *tokens
  before_script: *aws-prep
  script:
    - aws ecr describe-repositories --region eu-west-1 > describe_response.json
    - ECR_MITUP_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "mitup") | .repositoryUri' describe_response.json)
    - ECR_MIGRATIONS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrations-lambda") | .repositoryUri' describe_response.json)
    - echo "ECR_MITUP_REPO_URI=$ECR_MITUP_REPO_URI" >> dotenv
    - echo "ECR_MIGRATIONS_REPO_URI=$ECR_MIGRATIONS_REPO_URI" >> dotenv
    - echo "BOT_IMAGE_TAG=$ECR_MITUP_REPO_URI:ci-$CI_COMMIT_SHORT_SHA" >> dotenv
    - echo "MIGRATIONS_IMAGE_TAG=$ECR_MIGRATIONS_REPO_URI:ci-$CI_COMMIT_SHORT_SHA" >> dotenv

  artifacts:
    reports:
      dotenv: dotenv
    when: on_success
    expire_in: "30 days"

config-staging:
  extends: .aws-config
  resource_group: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      <<: *deploy-rules

config-prod:
  extends: .aws-config
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

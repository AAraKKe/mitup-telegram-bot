# --------------------
# Docker build and push images
# ---------------------
.docker-build-push: &docker-build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    # Enable BuildKit for better multi-stage builds and caching
    DOCKER_BUILDKIT: "1"
    # Disable TLS for dind communication within GitLab runner
    DOCKER_TLS_CERTDIR: ""
    # Connect to docker:dind service
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # Authenticate to GitLab Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Create and bootstrap buildx builder
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap
  script:
    - set -e
    - echo "Building $DOCKERFILE and pushing to $PUSH_DESTINATION..."
    - IMAGE_BASE_URI=$(echo "$PUSH_DESTINATION" | cut -d':' -f1)
    - CACHE_TAG="${IMAGE_BASE_URI}:build-cache"
    - |
      docker buildx build \
        --file "${CI_PROJECT_DIR}/dev/docker/${DOCKERFILE}" \
        --tag "${PUSH_DESTINATION}" \
        --cache-from "type=registry,ref=${CACHE_TAG}" \
        --cache-to "type=registry,ref=${CACHE_TAG},mode=max" \
        --push \
        --progress=plain \
        "${CI_PROJECT_DIR}"
  after_script:
    - docker buildx rm builder

# Exists in the pipeline ONLY when the image must actually be (re)built. Other jobs reference it
# with `needs: [{job: build-docker-ci, optional: true}]`: present -> they wait for the fresh image;
# absent -> they start immediately. The on-demand manual rebuild is the separate job below — it must
# NOT share this name, because an unplayed manual job in a `needs` list silently SKIPS every
# dependent job while the pipeline still reports success.
build-docker-ci:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    # Push to the dynamically determined tag
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python:${CI_IMAGE_TAG}"
  extends: .docker-build-push
  rules:
    # Build automatically for MR-specific images (when CI files changed in MR)
    - if: '$CI_IMAGE_TAG =~ /^mr-/'
    # Build on main when CI files changed
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: !reference [.ci-docker-files]
    # Allow manual trigger with [build-ci] in commit message
    - if: '$CI_COMMIT_TITLE =~ /\[build-ci\]/'

# Manual on-demand rebuild of the CI image. Nothing `needs` this job, so leaving it unplayed
# affects nothing.
build-docker-ci-manual:
  stage: build-ci
  variables:
    DOCKERFILE: Dockerfile.ci
    PUSH_DESTINATION: "${CI_REGISTRY_IMAGE}/ci-python:${CI_IMAGE_TAG}"
  extends: .docker-build-push
  rules:
    # Redundant when the automatic job already runs
    - if: '$CI_IMAGE_TAG =~ /^mr-/'
      when: never
    - if: '$CI_COMMIT_TITLE =~ /\[build-ci\]/'
      when: never
    - when: manual
      allow_failure: true

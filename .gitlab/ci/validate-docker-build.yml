.docker-build-template: &docker-build-template
  stage: test
  image: docker:28-cli
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" # Disable TLS
  script:
    - docker build -f $DOCKERFILE_PATH -t mitup-$DOCKERFILE_NAME:test .
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - $DOCKERFILE_PATH

validate-docker-base:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile
    DOCKERFILE_NAME: base

validate-docker-ci:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile.ci
    DOCKERFILE_NAME: ci

validate-docker-dev:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile.dev
    DOCKERFILE_NAME: dev

validate-docker-migrations:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile.migrations
    DOCKERFILE_NAME: migrations

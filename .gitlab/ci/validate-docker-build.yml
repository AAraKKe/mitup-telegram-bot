# Merge-request gate: prove every deployable image still builds before it can reach main and be
# pushed/deployed. These jobs never push — they only build.
#
# `validate-docker` is a single matrixed job covering all four deployable images (bot, events,
# lambda-migrations, lambda-alarm), gated by one broad path trigger: any change under apps/**,
# libs/**, the lock, or the root pyproject can affect these images. A path-curated trigger risks
# silently skipping validation on a shared-path change (a green pipeline with an unvalidated
# build); the shared runners are free, so breadth costs nothing. All four matrix entries always
# run together on a match.
.docker-build-template: &docker-build-template
  stage: test
  # Docker is held at 29.6.2 across the pipeline: the 29.7.0 daemon fails to extract the AWS Lambda
  # base image layers ("mkdirat var/lang: no such file or directory"), so the two lambda matrix
  # entries below cannot build. Restore the floating 29 tag once a fixed daemon is out.
  image: docker:29.6.2-cli
  services:
    - name: docker:29.6.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" # Disable TLS
  script:
    - docker build -f $DOCKERFILE_PATH -t mitup-$DOCKERFILE_NAME:test .

# ---- Deployable app images ----------------------------------------------------------------
validate-docker:
  <<: *docker-build-template
  # Applies to the whole matrix: the bot/events entries need the compiled locale catalogs baked
  # into their images; the lambda entries ignore the artifact since they don't localize anything.
  dependencies:
    - build-translations
  needs: [build-translations]
  parallel:
    matrix:
      - DOCKERFILE_NAME: bot
        DOCKERFILE_PATH: apps/bot/Dockerfile
      - DOCKERFILE_NAME: events
        DOCKERFILE_PATH: apps/events/Dockerfile
      - DOCKERFILE_NAME: migrations
        DOCKERFILE_PATH: apps/lambda-migrations/Dockerfile
      - DOCKERFILE_NAME: alarm
        DOCKERFILE_PATH: apps/lambda-alarm/Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - "apps/**/*"
        - "libs/**/*"
        - uv.lock
        - pyproject.toml
        - .dockerignore
        - .gitlab/ci/validate-docker-build.yml

# ---- Non-deployed images (dev tooling) ----------------------------------------------------
validate-docker-ci:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile.ci
    DOCKERFILE_NAME: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - dev/docker/Dockerfile.ci

validate-docker-dev:
  <<: *docker-build-template
  variables:
    DOCKERFILE_PATH: dev/docker/Dockerfile.dev
    DOCKERFILE_NAME: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - dev/docker/Dockerfile.dev

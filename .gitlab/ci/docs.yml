build-docs:
  stage: prepare-deployment
  script:
    - hatch run dev:build-docs
  artifacts:
    paths:
      - site
    expire_in: 1 day
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    # Only run if the doc files change
    - changes:
      - docs/**/*
      - mkdocs.yml

## -------------- Documentation ---------------
# Run after deploy to be sure that documentation is not updated until the bot has been updated
.push-docs: &push-docs
  stage: documentation
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    - mkdir -p ~/.aws
    - cp ${CI_PROJECT_DIR}/aws-config ~/.aws/config
    - hatch run dev:push-docs

push-docs-staging:
  extends: .push-docs
  resource_group: docs-staging
  environment:
    name: staging
  dependencies:
    - config-staging
    - build-docs
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      # Only run if in the default branch and the doc files change
      changes:
        - docs/**/*
        - mkdocs.yml

push-docs-production:
  extends: .push-docs
  resource_group: docs-production
  dependencies:
    - config-prod
    - build-docs
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

publish_docs_manual:
  stage: documentation
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  before_script:
    - mkdir -p ~/.aws
    - echo "${OIDC_TOKEN}" > ${CI_PROJECT_DIR}/web_identity_token
    - echo -e "[profile default]\nrole_arn=${SERVICE_CI_ROLE_ARN}\nweb_identity_token_file=${CI_PROJECT_DIR}/web_identity_token" > ~/.aws/config
  script:
    - echo "Building documentation before manual publish..."
    - hatch run dev:build-docs # Run build step first
    - echo "Manually publishing documentation and invalidating entire cache..."
    - hatch run dev:push-docs --invalidate-all
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' # Use default branch variable
      when: manual
      allow_failure: true
  environment:
    name: staging

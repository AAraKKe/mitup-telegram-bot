build-docs:
  stage: prepare-deployment
  script:
    - uv run mb docs build
  artifacts:
    paths:
      - site
    expire_in: 1 day
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    # A release tag republishes the docs after the deploy, so the site must be built on tags too
    # (push-docs depends on this artifact); otherwise only build when the docs change.
    - if: $CI_COMMIT_TAG =~ /^v/
    - changes:
        paths: !reference [.docs-files]

## -------------- Documentation ---------------
# Run after deploy to be sure that documentation is not updated until the bot has been updated
.push-docs: &push-docs
  stage: documentation
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    # Authenticate with this job's own OIDC token: docs publish runs after the deploy, so it
    # must not reuse credentials issued to an earlier job.
    - !reference [.aws-prep]
    - uv run mb docs publish

push-docs:
  extends: .push-docs
  resource_group: docs
  dependencies:
    - deploy-config
    - build-docs
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/

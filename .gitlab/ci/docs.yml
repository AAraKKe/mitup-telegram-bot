build-docs:
  stage: prepare-deployment
  script:
    - hatch run dev:build-docs
  artifacts:
    paths:
      - site
    expire_in: 1 day
  needs: [preparation]
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    # Only run if the doc files change
    - changes:
        paths: !reference [.docs-files]

## -------------- Documentation ---------------
# Run after deploy to be sure that documentation is not updated until the bot has been updated
.push-docs: &push-docs
  stage: documentation
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    # Authenticate with this job's own OIDC token: docs publish runs after the deploy, so it
    # must not reuse credentials issued to an earlier job.
    - !reference [.aws-prep]
    - hatch run dev:push-docs

push-docs-staging:
  extends: .push-docs
  resource_group: docs-staging
  environment:
    name: staging
  dependencies:
    - config-staging
    - build-docs
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      # Only run if in the default branch and the doc files change
      changes:
        paths: !reference [.docs-files]

push-docs-production:
  extends: .push-docs
  resource_group: docs-production
  dependencies:
    - config-prod
    - build-docs
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

publish_docs_manual:
  stage: documentation
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  before_script:
    - !reference [.aws-prep]
  script:
    - echo "Building documentation before manual publish..."
    - hatch run dev:build-docs # Run build step first
    - echo "Manually publishing documentation and invalidating entire cache..."
    - hatch run dev:push-docs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' # Use default branch variable
      when: manual
      allow_failure: true
  environment:
    name: staging

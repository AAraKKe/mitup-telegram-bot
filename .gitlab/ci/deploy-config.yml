# This job will configure the aws credentials and the ECR URIs
.aws-config: &aws-env-config
  stage: prepare-deployment
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    - mkdir -p ~/.aws
    - mkdir -p /tmp
    - echo "${OIDC_TOKEN}" > ${CI_PROJECT_DIR}/web_identity_token
    - echo -e "[profile default]\nrole_arn=${SERVICE_CI_ROLE_ARN}\nweb_identity_token_file=${CI_PROJECT_DIR}/web_identity_token" > ~/.aws/config
    - aws ecr describe-repositories --region eu-west-1 > describe_response.json
    - ECR_MITUP_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "mitup") | .repositoryUri' describe_response.json)
    - ECR_MIGRATIONS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrations-lambda") | .repositoryUri' describe_response.json)
    - ECR_MIGRATE_RAILS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrate-rails-lambda") | .repositoryUri' describe_response.json)
    - ECR_ALARM_ACTION_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "alarm-action-lambda") | .repositoryUri' describe_response.json)
    - echo "BOT_IMAGE_TAG=${ECR_MITUP_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "MIGRATIONS_IMAGE_TAG=${ECR_MIGRATIONS_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "MIGRATE_RAILS_IMAGE_TAG=${ECR_MIGRATE_RAILS_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "ALARM_ACTION_IMAGE_TAG=${ECR_ALARM_ACTION_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - cp ~/.aws/config ${CI_PROJECT_DIR}/aws-config

  artifacts:
    reports:
      dotenv: dotenv
    paths:
      - web_identity_token
      - aws-config
    when: on_success
    expire_in: 2 hours
    access: none

config-staging:
  extends: .aws-config
  resource_group: staging
  environment:
    name: staging
  # Do not block deployment on formatting/style issues
  needs:
    - test
    - type-check
    - validate-locales
    - validate-migrations
    - semgrep-sast
    - secret_detection

  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /\[force-deploy\]/
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: !reference [.deployment-files]
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: !reference [.docs-files]
      when: on_success

config-prod:
  extends: .aws-config
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "release"

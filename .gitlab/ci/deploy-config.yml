# This job resolves the ECR URIs shared with the push/deploy/docs jobs via the dotenv report.
# AWS credentials are NOT part of the artifacts: every job authenticates itself with its own
# job-scoped OIDC token (see .aws-prep in base.yml), so a job that queues for a long time
# behind a deploy bake never inherits an expired token from this job.
.aws-config: &aws-env-config
  stage: prepare-deployment
  id_tokens:
    OIDC_TOKEN:
      aud: mitup-gitlab-ci-service
  script:
    - !reference [.aws-prep]
    - aws ecr describe-repositories --region eu-west-1 > describe_response.json
    - ECR_MITUP_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "mitup") | .repositoryUri' describe_response.json)
    - ECR_MIGRATIONS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "migrations-lambda") | .repositoryUri' describe_response.json)
    - ECR_ALARM_ACTION_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "alarm-action-lambda") | .repositoryUri' describe_response.json)
    # The `events` repo is created by mitup-infra !43, a hard prerequisite merged+applied before this
    # MR, so it resolves here just like the others. It feeds the events push + deploy (deploy.yml).
    - ECR_EVENTS_REPO_URI=$(jq -r '.repositories[] | select(.repositoryName == "events") | .repositoryUri' describe_response.json)
    - echo "BOT_IMAGE_TAG=${ECR_MITUP_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "MIGRATIONS_IMAGE_TAG=${ECR_MIGRATIONS_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "ALARM_ACTION_IMAGE_TAG=${ECR_ALARM_ACTION_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv
    - echo "EVENTS_IMAGE_TAG=${ECR_EVENTS_REPO_URI}:ci-${CI_COMMIT_SHORT_SHA}" >> dotenv

  artifacts:
    reports:
      dotenv: dotenv
    when: on_success
    expire_in: 2 hours
    access: none

deploy-config:
  extends: .aws-config
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[no-deploy\]/
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/

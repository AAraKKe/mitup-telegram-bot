[project]
site_name = "Mitup Telegram Bot"
site_url = "https://mitup.social"
repo_url = "https://gitlab.com/meetupbot/mitup-telegram-bot"
repo_name = "MitupBot/mitup-telegram-bot"
extra_css = [
  "assets/stylesheets/main.css",
  "assets/stylesheets/mitup-components.css",
]

nav = [
  { "MitupBot" = "index.md" },
  { "User Guide" = [
    { "Getting Started" = "user-guide/getting_started.md" },
    { "Main Menu" = "user-guide/main_menu.md" },
    { "Mitup Configuration" = "user-guide/configuration.md" },
    { "Create a Meeting" = "user-guide/create_meeting.md" },
    { "Configure a Meeting" = "user-guide/configure_meeting.md" },
    { "Meeting Lifecycle" = "user-guide/meeting_lifecycle.md" },
  ] },
  { "FAQ" = [
    { "Privacy" = "faq/privacy.md" },
    { "About us" = "faq/about.md" },
  ] },
  { "Contribute" = [
    { "Being a supporter" = "collaborate/supporter.md" },
    { "Donation" = "collaborate/donation.md" },
    { "Become a Translator" = "collaborate/translator.md" },
    { "Code contributor" = [
      { "Overview" = "collaborate/code_contributor.md" },
      { "Setup" = "contribute/setup.md" },
      { "Making Contributions" = "contribute/making_contributions.md" },
      { "Local Validation" = "contribute/local_validation.md" },
      { "Commit Message Format" = "contribute/commit_message_format.md" },
      { "Logging" = "contribute/logging.md" },
    ] },
    { "Code of Conduct" = "collaborate/code_of_conduct.md" },
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
logo = "assets/images/mark-256.png"
favicon = "assets/images/favicon-32.png"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "content.code.annotate",
  "content.tooltips",
  "navigation.footer",
  "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/gitlab"

[[project.theme.palette]]
scheme = "default"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
name = "Bot"
link = "https://t.me/mitupbot"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
title = "On this page"
permalink_title = "Link to this section"

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

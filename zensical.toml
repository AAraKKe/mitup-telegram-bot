[project]
site_name = "Mitup Telegram Bot"
site_url = "https://mitup.social"
site_description = "A free, open-source Telegram bot for organizing meetups. Create a meeting, share one card in your group, and let Mitup handle RSVPs, reminders, and timezones."
repo_url = "https://gitlab.com/meetupbot/mitup-telegram-bot"
repo_name = "MitupBot/mitup-telegram-bot"
extra_css = [
  "assets/stylesheets/main.css",
  "assets/stylesheets/mitup-components.css",
]
extra_javascript = [
  "assets/javascripts/news-banner.js",
]

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    { "Welcome" = "user-guide/index.md" },
    { "Getting started" = "user-guide/getting_started.md" },
    { "The main menu" = "user-guide/main_menu.md" },
    { "Create a meeting" = "user-guide/create_a_meeting.md" },
    { "Meeting settings" = "user-guide/meeting_settings.md" },
    { "Sharing and joining" = "user-guide/sharing_and_joining.md" },
    { "Using Mitup from any chat" = "user-guide/inline_mode.md" },
    { "Meeting lifecycle" = "user-guide/meeting_lifecycle.md" },
    { "Your settings" = "user-guide/settings.md" },
    { "Limits and Host perks" = "user-guide/limits.md" },
  ] },
  { "FAQ" = [
    { "Privacy" = "faq/privacy.md" },
    { "Troubleshooting" = "faq/troubleshooting.md" },
    { "About us" = "faq/about.md" },
  ] },
  { "Contribute" = [
    "collaborate/index.md",
    { "Support financially" = "collaborate/donation.md" },
    { "Contribute code" = "collaborate/code_contributor.md" },
    { "Translate Mitup" = "collaborate/translator.md" },
    { "Code of conduct" = "collaborate/code_of_conduct.md" },
    { "Developer handbook" = [
      { "Setup" = "contribute/setup.md" },
      { "Understand" = [
        { "Architecture" = "contribute/architecture.md" },
        { "Where things live" = "contribute/project_layout.md" },
      ] },
      { "Build" = [
        { "Adding a handler" = "contribute/adding_a_handler.md" },
        { "Data and migrations" = "contribute/data_and_migrations.md" },
        { "Logging" = "contribute/logging.md" },
        { "The mb CLI" = "contribute/dev_cli.md" },
        { "Testing and validation" = "contribute/testing.md" },
      ] },
      { "Contribute" = [
        { "Contribution workflow" = "contribute/making_contributions.md" },
        { "Building with AI" = "contribute/working_with_agents.md" },
        { "Commit format" = "contribute/commit_message_format.md" },
        { "Versioning" = "contribute/versioning.md" },
      ] },
    ] },
  ] },
  { "News" = [
    { "What's new" = "news/index.md" },
    { "One week in" = "news/one_week_in.md" },
    { "Welcome to the new Mitup" = "news/welcome_to_the_new_mitup.md" },
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
logo = "assets/images/mark-256.png"
favicon = "assets/images/favicon-32.png"
features = [
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "content.code.annotate",
  "content.tooltips",
  "navigation.footer",
  "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/gitlab"

[[project.theme.palette]]
scheme = "default"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
name = "Bot"
link = "https://t.me/mitupbot?start=src_web"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
title = "On this page"
permalink_title = "Link to this section"

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

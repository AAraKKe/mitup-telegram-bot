{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ base_url }}assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}assets/images/app-icon-180.png">
  <meta property="og:image" content="https://mitup.social/assets/images/og-card-1200x630.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mitup.social/assets/images/og-card-1200x630.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Mitup",
    "url": "https://mitup.social",
    "image": "https://mitup.social/assets/images/mark-256.png",
    "description": "A free, open-source Telegram bot for organizing meetups. Create a meeting, share one card in your group, and let Mitup handle RSVPs, reminders, and timezones.",
    "applicationCategory": "CommunicationApplication",
    "operatingSystem": "Telegram",
    "offers": {"@type": "Offer", "price": "0", "priceCurrency": "EUR"},
    "license": "https://gitlab.com/meetupbot/mitup-telegram-bot/-/blob/main/LICENSE",
    "inLanguage": ["en", "es", "de", "gl", "pt-BR", "it"],
    "sameAs": [
      "https://t.me/mitupbot",
      "https://gitlab.com/meetupbot/mitup-telegram-bot",
      "https://github.com/AAraKKe/mitup-telegram-bot"
    ]
  }
  </script>
{% endblock %}

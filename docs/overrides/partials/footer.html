<!--
  Custom Mitup footer with three-column layout + bottom strip.
  Replaces Material's default footer copyright/social block.
-->

<footer class="mitup-footer">
  <div class="mitup-footer__grid">
    <!-- Column 1: Mitup brand -->
    <div class="mitup-footer__column">
      <div class="mitup-footer__logo">
        <img src="{{ base_url }}/assets/images/brand/logo-horizontal.png" alt="Mitup"/>
      </div>
      <p class="mitup-footer__tagline">Schedule with friends.</p>
      <ul class="mitup-footer__list">
        <li><a href="https://gitlab.com/meetupbot/mitup-telegram-bot" class="mitup-footer__link">Open source on GitLab</a></li>
        <li><a href="{{ base_url }}/faq/about/" class="mitup-footer__link">About us</a></li>
      </ul>
    </div>

    <!-- Column 2: Use the bot -->
    <div class="mitup-footer__column">
      <h3 class="mitup-footer__heading">Use the bot</h3>
      <ul class="mitup-footer__list">
        <li><a href="https://t.me/mitupbot" class="mitup-footer__link">@mitupbot on Telegram</a></li>
        <li><a href="{{ base_url }}/user-guide/getting_started/" class="mitup-footer__link">Getting started</a></li>
        <li><a href="{{ base_url }}/faq/privacy/" class="mitup-footer__link">Privacy</a></li>
      </ul>
    </div>

    <!-- Column 3: Help out -->
    <div class="mitup-footer__column">
      <h3 class="mitup-footer__heading">Help out</h3>
      <ul class="mitup-footer__list">
        <li><a href="{{ base_url }}/collaborate/code_contributor/" class="mitup-footer__link">Contribute code</a></li>
        <li><a href="{{ base_url }}/collaborate/translator/" class="mitup-footer__link">Translate</a></li>
        <li><a href="{{ base_url }}/collaborate/donation/" class="mitup-footer__link">Donate</a></li>
      </ul>
    </div>
  </div>

  <!-- Bottom strip -->
  <div class="mitup-footer__bottom">
    <p>MIT licensed &bullet; Not affiliated with Telegram &bullet; Copyright © 2026 Mitup</p>
  </div>
</footer>

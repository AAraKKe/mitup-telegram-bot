[project]
name = "mitup-patreon"
version = "0.0.1"
description = "Patreon integration layer for mitup-telegram-bot: the API client, OAuth flow, membership webhooks, and encrypted token storage"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "cryptography==50.0.0",
    "mitup-core",
    "mitup-data",
    "mitup-monitoring",
]

[tool.uv.sources]
mitup-core = { workspace = true }
mitup-data = { workspace = true }
mitup-monitoring = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mitup_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
